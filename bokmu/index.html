<title>복무요원 복무상황부</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* 배치: 위에서 아래로 한 줄기 — 사진 올리기 → 요원 고르기 → 날짜 달력·근무상황·보수 숫자 → 전체 보수표. 띠 색은 종이 복무상황부의 회청색 머리띠에서 가져옴 */
:root{
  --bg:#eef0f4; --panel:#ffffff; --ink:#1c2230; --muted:#5a6476; --line:#d3d8e1; --band:#c9d0dc; --accent:#2c4677; --accent-ink:#ffffff;
  --s-off:#e3e6ec; --s-off-ink:#6a7383;
  --s-leave:#dce8fb; --s-leave-ink:#1f4f9a;
  --s-sick:#fbe1e4; --s-sick-ink:#9b2335;
  --s-special:#ece3fa; --s-special-ink:#5b3596;
  --s-edu:#d9f1ec; --s-edu-ink:#16675a;
  --s-late:#fdf0d5; --s-late-ink:#8a5a00;
  --s-bad:#c9302c; --s-bad-ink:#ffffff;
  --ok:#1d7a4c; --warn:#b4231c;
  --f-body:"IBM Plex Sans KR","Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11151c; --panel:#191f29; --ink:#e5e8ee; --muted:#9ba4b3; --line:#2c3442; --band:#2a3446; --accent:#8fb0e8; --accent-ink:#0f1726;
  --s-off:#232a36; --s-off-ink:#8d96a6;
  --s-leave:#1d3152; --s-leave-ink:#a9c6f5;
  --s-sick:#4a1f27; --s-sick-ink:#f4b3bd;
  --s-special:#33264d; --s-special-ink:#cfb8f3;
  --s-edu:#173b35; --s-edu-ink:#94dccd;
  --s-late:#3f3216; --s-late-ink:#f0cd84;
  --s-bad:#d9534f; --s-bad-ink:#1a0b0b;
  --ok:#6fd49e; --warn:#ff8a80; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11151c; --panel:#191f29; --ink:#e5e8ee; --muted:#9ba4b3; --line:#2c3442; --band:#2a3446; --accent:#8fb0e8; --accent-ink:#0f1726;
  --s-off:#232a36; --s-off-ink:#8d96a6;
  --s-leave:#1d3152; --s-leave-ink:#a9c6f5;
  --s-sick:#4a1f27; --s-sick-ink:#f4b3bd;
  --s-special:#33264d; --s-special-ink:#cfb8f3;
  --s-edu:#173b35; --s-edu-ink:#94dccd;
  --s-late:#3f3216; --s-late-ink:#f0cd84;
  --s-bad:#d9534f; --s-bad-ink:#1a0b0b;
  --ok:#6fd49e; --warn:#ff8a80; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;font-variant-numeric:tabular-nums}
.wrap{max-width:1040px;margin:0 auto;padding-block:20px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:12px;justify-content:space-between}
h1{font-size:22px;font-weight:700;margin:0;letter-spacing:-.01em}
h2{font-size:16px;font-weight:600;margin:0}
h3{font-size:14px;font-weight:600;margin:0;color:var(--muted)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.band{background:var(--band);margin:-16px -16px 0;padding:10px 16px;border-radius:10px 10px 0 0;display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:space-between}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);min-width:0;flex:1 1 140px}
input[type=text],input[type=month],input[type=tel],input[type=number],textarea,select{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-width:0;width:100%}
input[type=month]{width:auto}
textarea{min-height:90px;resize:vertical}
button{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px;padding:6px 12px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button.sm{font-size:12px;padding:3px 8px}
button.danger{color:var(--warn)}
button:disabled{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted);font-size:13px}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tag.ok{color:var(--ok);border-color:currentColor}
.tag.warn{color:var(--warn);border-color:currentColor}
.status{font-size:13px;color:var(--muted);min-height:1.2em}
.status.err{color:var(--warn)}

#drop{border:2px dashed var(--line);border-radius:10px;padding:22px 16px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center;cursor:pointer}
#drop.over{border-color:var(--accent);background:var(--s-leave)}
#drop strong{font-size:15px}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border-radius:999px;padding:5px 12px;font-size:14px}
.chip.dim:not(.on){border-style:dashed;color:var(--muted)}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}

.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .wd{font-size:12px;text-align:center;color:var(--muted);padding-bottom:2px}
.cal .wd.sun{color:var(--warn)}
.day{border:1px solid var(--line);border-radius:6px;padding:3px;display:flex;flex-direction:column;gap:2px;min-width:0;background:var(--panel)}
.day .n{font-size:11px;color:var(--muted);padding-left:2px}
.day select{appearance:none;-webkit-appearance:none;border:0;border-radius:4px;padding:5px 2px;text-align:center;text-align-last:center;font-size:13px;font-weight:600;cursor:pointer;background:transparent}
.day.blank{border:0;background:transparent}
.st-출근 select{color:var(--ink)}
.st-휴일{background:var(--s-off)} .st-휴일 select{color:var(--s-off-ink);font-weight:500}
.st-연가{background:var(--s-leave)} .st-연가 select{color:var(--s-leave-ink)}
.st-병가,.st-공병{background:var(--s-sick)} .st-병가 select,.st-공병 select{color:var(--s-sick-ink)}
.st-특휴{background:var(--s-special)} .st-특휴 select{color:var(--s-special-ink)}
.st-교육{background:var(--s-edu)} .st-교육 select{color:var(--s-edu-ink)}
.st-지각,.st-조퇴,.st-외출{background:var(--s-late)} .st-지각 select,.st-조퇴 select,.st-외출 select{color:var(--s-late-ink)}
.st-결근{background:var(--s-bad)} .st-결근 select{color:var(--s-bad-ink)}
.st-예정{border-style:dashed} .st-예정 select{color:var(--muted)}
.st-확인{border:2px solid var(--warn)} .st-확인 select{color:var(--warn)}
.day select option{color:var(--ink);background:var(--panel)}

.scroll{overflow-x:auto;min-width:0}
table.t{border-collapse:collapse;width:100%;font-size:14px}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:6px 6px;text-align:left;vertical-align:middle}
table.t th{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap}
table.t td.num,table.t th.num{text-align:center}
table.t input{padding:4px 6px}
table.t input.n{width:56px;text-align:center}
table.t td.adj input{border-color:var(--accent)}
.kind{font-weight:600}
.counts{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.counts label{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--muted);text-align:center;min-width:0}
.counts input{text-align:center;font-weight:600;font-size:15px;padding:6px 2px}
.counts label.adj input{border-color:var(--accent);border-width:2px}
.preview{border:1px solid var(--accent);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:8px}
details > summary{cursor:pointer;font-weight:600;font-size:14px}
details[open] > summary{margin-bottom:10px}
.confirm{display:inline-flex;gap:6px;align-items:center}
@media (max-width:640px){
  .counts{grid-template-columns:repeat(4,minmax(0,1fr))}
  .day select{font-size:12px;padding:5px 0}
  h1{font-size:19px}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header>
    <h1>복무요원 복무상황부</h1>
    <div class="row">
      <label class="muted" for="month">복무 연월</label>
      <input type="month" id="month">
    </div>
  </header>

  <section class="panel" id="upPanel">
    <div class="band"><h2>근태현황 사진으로 채우기</h2><span class="tag" id="aiTag"></span></div>
    <div id="drop" tabindex="0" role="button" aria-label="근태현황 사진 올리기">
      <strong>사진을 여기로 끌어 놓거나 눌러서 고르기</strong>
      <span class="muted">화면 캡처 뒤 Ctrl+V로 붙여 넣어도 됩니다 · 여러 장 가능</span>
      <input type="file" id="file" accept="image/*" multiple hidden>
    </div>
    <div class="status" id="upStatus"></div>
    <details id="gptBox" hidden>
      <summary>ChatGPT로 읽기</summary>
      <div class="row" style="flex-direction:column;align-items:stretch;gap:8px">
        <div class="row"><button id="gptCopy" type="button">요청문 복사</button><span class="muted">ChatGPT에 근태현황 사진과 함께 붙여 넣고, 받은 답을 아래에 붙여 넣기</span></div>
        <textarea id="gptReply" placeholder="ChatGPT 답 붙여 넣기"></textarea>
        <div class="row"><button id="gptRead" type="button" class="pri">답 읽기</button></div>
      </div>
    </details>
    <div id="preview" hidden></div>
  </section>

  <section class="panel">
    <div class="band"><h2>요원</h2><div class="row"><button id="addP" type="button" class="sm">+ 요원 추가</button></div></div>
    <div class="chips" id="chips"></div>
    <div id="person"></div>
  </section>

  <section class="panel">
    <div class="band"><h2 id="allTitle">보수명세서 근무상황</h2>
      <div class="row"><button id="copyAll" type="button" class="sm">숫자 모두 복사</button><button id="printAll" type="button" class="sm pri">전체 복무상황부 파일</button></div></div>
    <div class="scroll"><table class="t" id="allTable"></table></div>
    <div class="status" id="allStatus"></div>
  </section>

  <details class="panel" id="setBox">
    <summary>기본값·백업</summary>
    <div class="row">
      <label class="f">복무기관<input type="text" id="s_org"></label>
      <label class="f">복무분야<input type="text" id="s_field"></label>
      <label class="f">복무형태<input type="text" id="s_type"></label>
      <label class="f">근무지<input type="text" id="s_place"></label>
    </div>
    <div class="row">
      <label class="f">결재란 (쉼표로 구분)<input type="text" id="s_sign"></label>
      <label class="f">기본 직무수행 태도<input type="text" id="s_att"></label>
      <label class="f">연가·특휴 기본 사유<input type="text" id="s_reason"></label>
    </div>
    <div class="row">
      <label class="row muted"><input type="checkbox" id="s_sp"> 특별휴가를 연가일수에 넣기</label>
      <label class="row muted"><input type="checkbox" id="s_join"> 연가·병가도 이어진 날은 한 줄로</label>
    </div>
    <div class="row">
      <button id="bkSave" type="button">백업 파일 저장</button>
      <button id="bkLoad" type="button">백업 불러오기</button>
      <input type="file" id="bkFile" accept=".json,application/json" hidden>
      <span class="status" id="bkStatus"></span>
    </div>
  </details>
</div>

<script>
"use strict";
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const KEY = "bokmu.v1";
const WEB = !window.claude;

/* 날짜 상태. 코드 → 화면 이름 */
const CODES = [["출근","출근"],["휴일","휴일"],["연가","연가"],["병가","병가"],["공병","공무상병가"],["특휴","특별휴가"],["교육","교육"],["지각","지각"],["조퇴","조퇴"],["외출","외출"],["결근","무단결근"],["예정","근무편성"],["확인","확인 필요"]];
const SHORT = {출근:"출근",휴일:"휴일",연가:"연가",병가:"병가",공병:"공병",특휴:"특휴",교육:"교육",지각:"지각",조퇴:"조퇴",외출:"외출",결근:"결근",예정:"예정",확인:"확인"};
/* 근무상황 표에 줄로 올라가는 상태와 종별 이름 */
const KIND = {연가:"연가",병가:"병가",공병:"공무상병가",특휴:"특별휴가",교육:"교육",지각:"지각",조퇴:"조퇴",외출:"외출",결근:"무단결근"};
/* 종이 양식 본인 칸에 미리 적는 글자 (출근한 날은 비워 두고 본인이 서명) */
const SELF = {휴일:"휴일",연가:"연가",병가:"병가",공병:"병가",특휴:"특휴",교육:"교육",지각:"지각",조퇴:"조퇴",외출:"외출",결근:"결근"};
/* 보수명세서 근무상황 칸 (R~X) */
const COLS = [["out","출근일수"],["annual","연가일수"],["sick","30일 이내 병가일수"],["edu","교육일수"],["awol","복무이탈일수"],["overA","연가초과 결근일수"],["overS","30일초과 병가일수"]];

/* 관공서 공휴일 (대체공휴일 포함). 틀린 날은 달력에서 직접 고칠 수 있음 */
const HOLI = {
  2025:["01-01","01-27","01-28","01-29","01-30","03-01","03-03","05-05","05-06","06-03","06-06","08-15","10-03","10-05","10-06","10-07","10-08","10-09","12-25"],
  2026:["01-01","02-16","02-17","02-18","03-01","03-02","05-05","05-24","05-25","06-03","06-06","08-15","08-17","09-24","09-25","09-26","09-28","10-03","10-05","10-09","12-25"],
  2027:["01-01","02-06","02-07","02-08","02-09","03-01","05-05","05-13","06-06","08-15","08-16","09-14","09-15","09-16","10-03","10-04","10-09","10-11","12-25","12-27"]
};

const pad = n => String(n).padStart(2, "0");
const ymParts = ym => ym.split("-").map(Number);
const dim = ym => { const [y,m] = ymParts(ym); return new Date(y, m, 0).getDate(); };
const wday = (ym, d) => { const [y,m] = ymParts(ym); return new Date(y, m-1, d).getDay(); };
const isHoli = (ym, d) => { const [y,m] = ymParts(ym); const w = wday(ym, d); return w === 0 || w === 6 || (HOLI[y] || []).includes(pad(m)+"-"+pad(d)); };
const fmtD = (ym, d) => { const [y,m] = ymParts(ym); return y+"."+pad(m)+"."+pad(d); };
const uid = () => "p" + Date.now().toString(36) + Math.random().toString(36).slice(2,6);

/* ---------- 저장 ---------- */
function blank(){
  return {v:1, set:{org:"",field:"",type:"주간",place:"",sign:"담당,사무국장,원장",att:"양호",reason:"개인사유",sp:true,join:false}, people:[], months:{}, ui:{}};
}
function norm(d){
  const b = blank();
  if (!d || typeof d !== "object") return b;
  d.set = Object.assign(b.set, d.set || {});
  d.people = Array.isArray(d.people) ? d.people.filter(p => p && p.id) : [];
  d.months = d.months && typeof d.months === "object" ? d.months : {};
  d.ui = d.ui && typeof d.ui === "object" ? d.ui : {};
  d.v = 1;
  return d;
}
let db = blank();
try { const raw = localStorage.getItem(KEY); if (raw) db = norm(JSON.parse(raw)); } catch (e) {}
let saveT = 0;
function save(){ clearTimeout(saveT); saveT = setTimeout(() => { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) {} }, 200); }

const now = new Date();
let cur = { ym: db.ui.ym || (now.getFullYear()+"-"+pad(now.getMonth()+1)), pid: db.ui.pid || "" };

const person = id => db.people.find(p => p.id === id);
function rec(ym, pid, make){
  if (!db.months[ym]) { if (!make) return null; db.months[ym] = {}; }
  if (!db.months[ym][pid]) { if (!make) return null; db.months[ym][pid] = {days:null, src:"", notes:{}, adj:{}, portal:null}; }
  const r = db.months[ym][pid];
  r.notes = r.notes || {}; r.adj = r.adj || {};
  return r;
}
function defDays(ym){ const o = {}; for (let d = 1; d <= dim(ym); d++) o[d] = isHoli(ym, d) ? "휴일" : "출근"; return o; }
function daysOf(ym, pid){ const r = rec(ym, pid); if (r && r.days) return r.days; return defDays(ym); }

/* ---------- 계산 ---------- */
function tally(days, ym){
  const c = {}; CODES.forEach(([k]) => c[k] = 0);
  for (let d = 1; d <= dim(ym); d++) c[days[d]] = (c[days[d]] || 0) + 1;
  return c;
}
function autoCounts(days, ym){
  const c = tally(days, ym);
  return {
    out: c.출근 + c.지각 + c.조퇴 + c.외출 + c.예정,
    annual: c.연가 + (db.set.sp ? c.특휴 : 0),
    sick: c.병가 + c.공병,
    edu: c.교육,
    awol: c.결근,
    overA: 0, overS: 0
  };
}
function counts(ym, pid){
  const a = autoCounts(daysOf(ym, pid), ym), r = rec(ym, pid), out = {};
  COLS.forEach(([k]) => out[k] = (r && r.adj && r.adj[k] != null && r.adj[k] !== "") ? Number(r.adj[k]) : a[k]);
  return {auto:a, val:out};
}
/* 근무상황 표 줄: 교육·공무상병가는 이어진 날(사이 휴일 포함)을 한 줄로, 연가·병가 등은 하루씩 */
function rowsOf(ym, pid){
  const days = daysOf(ym, pid), N = dim(ym), r = rec(ym, pid), rows = [];
  const joinKinds = new Set(["교육","공병"]);
  if (db.set.join) ["연가","병가","특휴","결근"].forEach(k => joinKinds.add(k));
  let d = 1;
  while (d <= N) {
    const c = days[d];
    if (!KIND[c]) { d++; continue; }
    let end = d;
    if (joinKinds.has(c)) { let k = d + 1; while (k <= N && (days[k] === c || days[k] === "휴일")) { if (days[k] === c) end = k; k++; } }
    const key = c + "|" + d, note = (r && r.notes[key]) || {};
    const defReason = (c === "연가" || c === "특휴") ? db.set.reason : (c === "공병" ? "공무상병가" : "");
    rows.push({key, code:c, kind:KIND[c], s:d, e:end,
      period: note.p != null ? note.p : (end === d ? fmtD(ym, d) : fmtD(ym, d) + " ~ " + fmtD(ym, end)),
      reason: note.r != null ? note.r : defReason,
      att: note.a != null ? note.a : db.set.att});
    d = end + 1;
  }
  return rows;
}
/* 포털 합계와 날짜 목록 비교 */
function portalCheck(ym, pid){
  const r = rec(ym, pid); if (!r || !r.portal) return null;
  const p = r.portal, c = tally(daysOf(ym, pid), ym), diffs = [];
  const work = dim(ym) - c.휴일;
  const att = c.출근 + c.예정 + c.지각 + c.조퇴 + c.외출 + c.교육;
  const pairs = [["출근일수", p.workdays, work], ["정상·야간출근", (p.normal||0) + (p.night||0), att], ["연가", p.annual, c.연가], ["병가", p.sick, c.병가], ["병가(공무)", p.sickDuty, c.공병], ["무단결근", p.absent, c.결근], ["특별휴가", p.special, c.특휴]];
  pairs.forEach(([n, a, b]) => { if (a != null && Number(a) !== b) diffs.push(n + " " + a + "≠" + b); });
  return {p, diffs};
}

async function copyText(txt, statusEl, okMsg){
  try { await navigator.clipboard.writeText(txt); statusEl.textContent = okMsg; statusEl.className = "status"; }
  catch (e) {
    statusEl.innerHTML = '복사가 막혔습니다. 아래 글을 선택해 Ctrl+C 하세요.<br><textarea readonly style="min-height:60px">' + esc(txt) + '</textarea>';
    const ta = statusEl.querySelector("textarea"); ta.focus(); ta.select();
  }
}

/* ---------- 파일 내려받기 ---------- */
let downloads = null;
async function saveFile(name, data, type, statusEl){
  if (downloads) {
    try { await downloads.save({filename:name, data}); statusEl.textContent = name + " 파일을 저장했습니다."; statusEl.className = "status"; }
    catch (e) { statusEl.textContent = e && e.code === "declined" ? "저장을 취소했습니다." : "파일을 저장하지 못했습니다."; statusEl.className = "status err"; }
    return;
  }
  try {
    const url = URL.createObjectURL(new Blob([data], {type}));
    const a = document.createElement("a"); a.href = url; a.download = name; document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    statusEl.textContent = name + " 파일을 내려받았습니다."; statusEl.className = "status";
  } catch (e) { statusEl.textContent = "파일을 저장하지 못했습니다."; statusEl.className = "status err"; }
}

/* ---------- 사진 읽기 ---------- */
const PROMPT = [
  "이 사진은 사회복무요원 근태현황 화면이다. 화면에 보이는 글자만 옮겨라. 보이지 않는 내용은 추측해서 채우지 마라.",
  "화면에는 요원별 합계 표(근무지, 성명, 생년월일, 출근일수, 정상출근, 야간출근, 연가, 병가, 병가(공무), 무단결근, 특별휴가)와, 한 요원의 날짜별 목록(복무일자, 요일, 근태구분)이 있을 수 있다. 둘 중 하나만 있을 수도 있다.",
  "아래 형식의 JSON 하나만 답하라. 설명이나 ``` 표시는 쓰지 마라.",
  '{"summary":[{"name":"성명","workdays":0,"normal":0,"night":0,"annual":0,"sick":0,"sickDuty":0,"absent":0,"special":0}],"selected":"날짜별 목록의 주인 성명(합계 표에서 강조 표시된 줄). 모르면 빈 문자열","days":[{"date":"YYYY-MM-DD","kind":"근태구분 칸 글자 그대로"}]}',
  "규칙: 생년월일·주민번호·연락처는 절대 적지 마라. 합계 표가 없으면 summary는 [], 날짜별 목록이 없으면 days는 []. 날짜별 목록은 한 줄도 빠뜨리지 말고 모두 적어라. 숫자 칸은 숫자로 적어라."
].join("\n");

let sample = null, imgOK = false, results = [];
function setUp(msg, err){ $("upStatus").textContent = msg; $("upStatus").className = "status" + (err ? " err" : ""); }
function paintAIMode(){
  const ai = sample && imgOK;
  $("aiTag").textContent = ai ? "Claude가 읽음" : "ChatGPT로 읽기";

}
(async () => {

    try { sample = await window.claude.use("sample"); } catch (e) { sample = null; }

function mapKind(t){
  t = String(t || "").replace(/\s/g, "");
  if (/반가|반일|오전|오후|시간/.test(t)) return "확인";
  if (/공무|공상/.test(t)) return "공병";
  if (/병가/.test(t)) return "병가";
  if (/특별|특휴|경조|청원/.test(t)) return "특휴";
  if (/연가|휴가/.test(t)) return "연가";
  if (/교육/.test(t)) return "교육";
  if (/지각/.test(t)) return "지각";
  if (/조퇴/.test(t)) return "조퇴";
  if (/외출/.test(t)) return "외출";
  if (/무단|결근|이탈/.test(t)) return "결근";
  if (/편성|예정/.test(t)) return "예정";
  if (/휴일|공휴|휴무/.test(t)) return "휴일";
  if (/출근|정상|야간|근무/.test(t)) return "출근";
  return "확인";
}
const numOr = v => { const n = Number(String(v == null ? "" : v).replace(/[^\d.-]/g, "")); return isFinite(n) && String(v).trim() !== "" ? n : 0; };
function parseReply(text){
  const s = String(text || ""), a = s.indexOf("{"), b = s.lastIndexOf("}");
  if (a < 0 || b <= a) throw new Error("bad");
  const o = JSON.parse(s.slice(a, b + 1));
  const summary = (Array.isArray(o.summary) ? o.summary : []).filter(x => x && String(x.name || "").trim()).map(x => ({
    name: String(x.name).trim(), workdays: numOr(x.workdays), normal: numOr(x.normal), night: numOr(x.night), annual: numOr(x.annual),
    sick: numOr(x.sick), sickDuty: numOr(x.sickDuty), absent: numOr(x.absent), special: numOr(x.special)}));
  const days = (Array.isArray(o.days) ? o.days : []).map(x => ({date: String((x && x.date) || "").trim(), kind: String((x && x.kind) || "").trim()}))
    .filter(x => /^\d{4}-\d{1,2}-\d{1,2}$/.test(x.date));
  if (!summary.length && !days.length) throw new Error("empty");
  const cnt = {};
  days.forEach(x => { const [y, m] = x.date.split("-"); const k = y + "-" + pad(+m); cnt[k] = (cnt[k] || 0) + 1; });
  const ym = Object.keys(cnt).sort((p, q) => cnt[q] - cnt[p])[0] || "";
  const sel = String(o.selected || "").trim();
  return {summary, days, ym, selected: sel};
}
function matchTarget(r){
  if (!r.days.length) return "";
  const nm = r.selected || (r.summary.length === 1 ? r.summary[0].name : "");
  const hit = db.people.find(p => p.name === nm);
  return hit ? hit.id : (nm ? "new:" + nm : (person(cur.pid) ? cur.pid : "new:"));
}
function paintPreview(){
  const box = $("preview");
  if (!results.length) { box.hidden = true; box.innerHTML = ""; return; }
  box.hidden = false;
  box.innerHTML = results.map((r, i) => {
    let h = '<div class="preview" data-i="' + i + '"><div class="row" style="justify-content:space-between"><strong>읽은 결과 ' + (results.length > 1 ? (i + 1) : "") + '</strong>' + (r.ym ? '<span class="tag">' + r.ym.replace("-", "년 ") + '월</span>' : "") + '</div>';
    if (r.summary.length) h += '<div class="muted">합계표: ' + r.summary.map(s => esc(s.name) + ' (출근일수 ' + s.workdays + ', 연가 ' + s.annual + ', 병가 ' + s.sick + (s.special ? ', 특휴 ' + s.special : "") + ')').join(" · ") + '</div>';
    if (r.days.length) {
      const c = {}; r.days.forEach(x => { const k = mapKind(x.kind); c[k] = (c[k] || 0) + 1; });
      const odd = r.days.filter(x => mapKind(x.kind) === "확인").map(x => x.date.slice(5) + " " + x.kind);
      h += '<div class="row"><span class="muted">날짜별 목록 ' + r.days.length + '일 (' + Object.entries(c).map(([k, n]) => (CODES.find(z => z[0] === k) || [k, k])[1] + ' ' + n).join(", ") + ') →</span>' +
        '<select data-target="' + i + '" style="width:auto">' +
          db.people.map(p => '<option value="' + p.id + '"' + (r.target === p.id ? " selected" : "") + '>' + esc(p.name) + '</option>').join("") +
          (r.target.startsWith("new:") ? '<option value="' + esc(r.target) + '" selected>새 요원' + (r.target.length > 4 ? ": " + esc(r.target.slice(4)) : "") + '</option>' : '<option value="new:">새 요원</option>') +
        '</select></div>';
      if (odd.length) h += '<div><span class="tag warn">확인 필요</span> <span class="muted">' + esc(odd.join(", ")) + '</span></div>';
    }
    return h + '</div>';
  }).join("") + '<div class="row"><button type="button" class="pri" id="applyAll">달력에 채우기</button><button type="button" id="cancelAll">취소</button></div>';
}
$("preview").addEventListener("change", e => { const s = e.target.closest("[data-target]"); if (s) results[+s.dataset.target].target = s.value; });
$("preview").addEventListener("click", e => {
  if (e.target.id === "cancelAll") { results = []; paintPreview(); setUp(""); }
  if (e.target.id === "applyAll") applyResults();
});
function findOrAdd(name){
  let p = db.people.find(x => x.name === name);
  if (!p) { p = {id:uid(), name: name || "새 요원", phone:"", org:"", field:"", type:"", place:""}; db.people.push(p); }
  return p;
}
function applyResults(){
  let lastYm = cur.ym, lastPid = cur.pid, filled = 0, added = db.people.length;
  results.forEach(r => {
    const ym = r.ym || cur.ym;
    r.summary.forEach(s => { const p = findOrAdd(s.name); const R = rec(ym, p.id, true); const {name, ...rest} = s; R.portal = rest; });
    if (r.days.length) {
      const p = r.target && !r.target.startsWith("new:") && person(r.target) ? person(r.target) : findOrAdd(r.target ? r.target.slice(4) : "");
      const R = rec(ym, p.id, true), days = {};
      for (let d = 1; d <= dim(ym); d++) days[d] = "휴일";
      r.days.forEach(x => { const [y, m, d] = x.date.split("-").map(Number); if (y + "-" + pad(m) === ym && d >= 1 && d <= dim(ym)) days[d] = mapKind(x.kind); });
      R.days = days; R.src = "사진"; filled++;
      lastPid = p.id;
    }
    lastYm = ym;
  });
  added = db.people.length - added;
  cur.ym = lastYm; cur.pid = lastPid || cur.pid;
  results = []; paintPreview(); paint();
  setUp("채웠습니다." + (filled ? " 날짜별 목록 " + filled + "명." : "") + (added ? " 새 요원 " + added + "명 추가." : "") + " 아래 달력을 확인해 주세요.");
}
function errMsg(e){
  const c = e && e.code;
  if (c === "not_granted") return "AI 사용을 허락하지 않아 읽지 못했습니다. ChatGPT로 읽기를 쓰거나 달력을 직접 고치세요.";
  if (c === "rate_limited") return "요청이 많아 잠시 막혔습니다. 1분쯤 뒤에 다시 올려 주세요.";
  if (c === "images_unavailable") return "이 화면에서는 사진을 AI에 보낼 수 없습니다. ChatGPT로 읽기를 쓰세요.";
  if (e && (e.message === "bad" || e.message === "empty" || e instanceof SyntaxError)) return "사진에서 근태 표를 찾지 못했습니다. 표가 잘 보이게 다시 찍어 올려 주세요.";
  return "사진을 읽지 못했습니다. 다시 올리거나 달력을 직접 고치세요.";
}
let reading = false;
async function readImages(files){
  files = files.filter(f => f && /^image\//.test(f.type));
  if (!files.length) { setUp("사진 파일만 올릴 수 있습니다.", true); return; }
  if (!(sample && imgOK)) {
    $("gptBox").hidden = false; $("gptBox").open = true;
    setUp("이 화면에서는 AI가 사진을 직접 읽을 수 없습니다. ‘요청문 복사’를 눌러 ChatGPT에 사진과 함께 물어보세요.", true);
    return;
  }
  if (reading) return;
  reading = true; results = []; paintPreview();
  const errs = [];
  for (let i = 0; i < files.length; i++) {
    setUp("사진을 읽는 중… " + (files.length > 1 ? "(" + (i + 1) + "/" + files.length + ") " : "") + "30초쯤 걸립니다.");
    try {
      const out = await sample(PROMPT, {images:[files[i]], cache:false});
      const r = parseReply(out.text); r.target = matchTarget(r); results.push(r);
    } catch (e) { errs.push(errMsg(e)); if (e && (e.code === "not_granted" || e.code === "rate_limited")) break; }
  }
  reading = false;
  paintPreview();
  if (results.length) setUp(errs.length ? errs.length + "장은 읽지 못했습니다. " + errs[0] : "다 읽었습니다. 맞는지 보고 ‘달력에 채우기’를 누르세요.", !!errs.length);
  else setUp(errs[0] || "읽지 못했습니다.", true);
}
const drop = $("drop");
drop.addEventListener("click", () => $("file").click());
drop.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); $("file").click(); } });
$("file").addEventListener("change", e => { const fs = [...e.target.files]; e.target.value = ""; readImages(fs); });
["dragenter","dragover"].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.add("over"); }));
["dragleave","drop"].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop", e => readImages([...(e.dataTransfer && e.dataTransfer.files || [])]));
document.addEventListener("paste", e => {
  const items = [...(e.clipboardData && e.clipboardData.items || [])].filter(it => it.kind === "file" && /^image\//.test(it.type));
  if (!items.length) return;
  e.preventDefault(); readImages(items.map(it => it.getAsFile()));
});
$("gptCopy").addEventListener("click", () => copyText(PROMPT, $("upStatus"), "요청문을 복사했습니다. ChatGPT에 근태현황 사진을 올리고 이 글을 붙여 넣으세요."));
$("gptRead").addEventListener("click", () => {
  try { const r = parseReply($("gptReply").value); r.target = matchTarget(r); results = [r]; paintPreview(); setUp("읽었습니다. 맞는지 보고 ‘달력에 채우기’를 누르세요."); $("gptReply").value = ""; }
  catch (e) { setUp("답에서 근태 내용을 찾지 못했습니다. ChatGPT 답 전체를 그대로 붙여 넣어 주세요.", true); }
});

paintSet();
paint();
