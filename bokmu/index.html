<title>복무요원 복무상황부 (주소 바뀜)</title>
<!-- 복무상황부는 2026-11-25에 별도 저장소(minseok3773/bokmu)로 옮겼습니다. 이 페이지는 예전 주소에서 새 주소로 넘겨 줍니다.
     같은 사이트(minseok3773.github.io)라 브라우저 기록(bokmu.v1)은 새 주소에서도 그대로 보입니다. -->
<meta http-equiv="refresh" content="3; url=https://minseok3773.github.io/bokmu/">
<style>body{font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif;margin:0;padding:32px 16px;background:#eef0f4;color:#1c2230;line-height:1.6}a{color:#2c4677;font-weight:700}</style>
<script>
(async () => {
  /* 예전 주소에 남은 서비스 워커를 지우고 새 주소로 넘어감 */
  try { const rs = navigator.serviceWorker && await navigator.serviceWorker.getRegistrations(); if (rs) for (const r of rs) if (/\/yakkuk\/bokmu\//.test(r.scope)) await r.unregister(); } catch (e) {}
  location.replace("https://minseok3773.github.io/bokmu/" + location.hash);
})();
</script>
</head>
<body>
<p>복무상황부 주소가 바뀌었습니다. 잠시 뒤 새 주소로 넘어갑니다.</p>
<p><a href="https://minseok3773.github.io/bokmu/">https://minseok3773.github.io/bokmu/</a></p>
<p>바탕화면 바로가기는 새 주소로 다시 만들어 주세요. 기록은 그대로 있습니다.</p>
</body>
</html>
