<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>복무요원 복무상황부</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="robots" content="noindex,nofollow">
<!-- 이 파일을 고쳐 main이나 작업 가지에 올리면 GitHub Actions(.github/workflows/bokmu-pages.yml)가 웹사이트판(gh-pages의 bokmu/)에 자동으로 반영합니다. Claude판은 따로 다시 게시합니다. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* 배치: 위에서 아래로 한 줄기 — 사진 올리기 → 요원 고르기 → 날짜 달력·근무상황·보수 숫자 → 전체 보수표. 띠 색은 종이 복무상황부의 회청색 머리띠에서 가져옴 */
:root{
  --bg:#eef0f4; --panel:#ffffff; --ink:#1c2230; --muted:#5a6476; --line:#d3d8e1; --band:#c9d0dc; --accent:#2c4677; --accent-ink:#ffffff;
  --s-off:#e3e6ec; --s-off-ink:#6a7383;
  --s-leave:#dce8fb; --s-leave-ink:#1f4f9a;
  --s-sick:#fbe1e4; --s-sick-ink:#9b2335;
  --s-special:#ece3fa; --s-special-ink:#5b3596;
  --s-edu:#d9f1ec; --s-edu-ink:#16675a;
  --s-late:#fdf0d5; --s-late-ink:#8a5a00;
  --s-bad:#c9302c; --s-bad-ink:#ffffff;
  --ok:#1d7a4c; --warn:#b4231c;
  --f-body:"IBM Plex Sans KR","Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11151c; --panel:#191f29; --ink:#e5e8ee; --muted:#9ba4b3; --line:#2c3442; --band:#2a3446; --accent:#8fb0e8; --accent-ink:#0f1726;
  --s-off:#232a36; --s-off-ink:#8d96a6;
  --s-leave:#1d3152; --s-leave-ink:#a9c6f5;
  --s-sick:#4a1f27; --s-sick-ink:#f4b3bd;
  --s-special:#33264d; --s-special-ink:#cfb8f3;
  --s-edu:#173b35; --s-edu-ink:#94dccd;
  --s-late:#3f3216; --s-late-ink:#f0cd84;
  --s-bad:#d9534f; --s-bad-ink:#1a0b0b;
  --ok:#6fd49e; --warn:#ff8a80; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11151c; --panel:#191f29; --ink:#e5e8ee; --muted:#9ba4b3; --line:#2c3442; --band:#2a3446; --accent:#8fb0e8; --accent-ink:#0f1726;
  --s-off:#232a36; --s-off-ink:#8d96a6;
  --s-leave:#1d3152; --s-leave-ink:#a9c6f5;
  --s-sick:#4a1f27; --s-sick-ink:#f4b3bd;
  --s-special:#33264d; --s-special-ink:#cfb8f3;
  --s-edu:#173b35; --s-edu-ink:#94dccd;
  --s-late:#3f3216; --s-late-ink:#f0cd84;
  --s-bad:#d9534f; --s-bad-ink:#1a0b0b;
  --ok:#6fd49e; --warn:#ff8a80; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;font-variant-numeric:tabular-nums}
.wrap{max-width:1040px;margin:0 auto;padding-block:20px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:12px;justify-content:space-between}
h1{font-size:22px;font-weight:700;margin:0;letter-spacing:-.01em}
h2{font-size:16px;font-weight:600;margin:0}
h3{font-size:14px;font-weight:600;margin:0;color:var(--muted)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.band{background:var(--band);margin:-16px -16px 0;padding:10px 16px;border-radius:10px 10px 0 0;display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:space-between}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);min-width:0;flex:1 1 140px}
input[type=text],input[type=month],input[type=tel],input[type=number],textarea,select{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-width:0;width:100%}
input[type=month]{width:auto}
textarea{min-height:90px;resize:vertical}
button{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px;padding:6px 12px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button.sm{font-size:12px;padding:3px 8px}
button.danger{color:var(--warn)}
button:disabled{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted);font-size:13px}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tag.ok{color:var(--ok);border-color:currentColor}
.tag.warn{color:var(--warn);border-color:currentColor}
.status{font-size:13px;color:var(--muted);min-height:1.2em}
.status.err{color:var(--warn)}

#pasteBox{min-height:0;resize:none;text-align:center;border:2px dashed var(--accent);background:var(--s-leave);color:var(--ink)}
#pasteBox::placeholder{color:var(--s-leave-ink);font-weight:600}
#drop{border:2px dashed var(--line);border-radius:10px;padding:22px 16px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center;cursor:pointer}
#drop.over{border-color:var(--accent);background:var(--s-leave)}
#pzone{border:2px dashed var(--accent);background:var(--s-leave);color:var(--ink);border-radius:8px;padding:12px 14px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;cursor:text}
#pzone:focus{outline:3px solid var(--accent);outline-offset:2px}
#pzone.over{background:var(--panel)}
#pzone .pz-t{display:flex;flex-direction:column;gap:2px;min-width:0}
#pzone strong{color:var(--s-leave-ink)}
#pzone .pz-ready{display:none;font-weight:600;color:var(--s-leave-ink)}
#pzone:focus .pz-ready{display:inline}
.pmsg{font-size:14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pmsg.err{color:var(--warn)}
#drop strong{font-size:15px}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border-radius:999px;padding:5px 12px;font-size:14px}
.chip.dim:not(.on){border-style:dashed;color:var(--muted)}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}

.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .wd{font-size:12px;text-align:center;color:var(--muted);padding-bottom:2px}
.cal .wd.sun{color:var(--warn)}
.day{border:1px solid var(--line);border-radius:6px;padding:3px;display:flex;flex-direction:column;gap:2px;min-width:0;background:var(--panel)}
.day .n{font-size:11px;color:var(--muted);padding-left:2px}
.day select{appearance:none;-webkit-appearance:none;border:0;border-radius:4px;padding:5px 2px;text-align:center;text-align-last:center;font-size:13px;font-weight:600;cursor:pointer;background:transparent}
.day.blank{border:0;background:transparent}
.st-출근 select{color:var(--ink)}
.st-휴일{background:var(--s-off)} .st-휴일 select{color:var(--s-off-ink);font-weight:500}
.st-연가{background:var(--s-leave)} .st-연가 select{color:var(--s-leave-ink)}
.st-병가,.st-공병{background:var(--s-sick)} .st-병가 select,.st-공병 select{color:var(--s-sick-ink)}
.st-특휴{background:var(--s-special)} .st-특휴 select{color:var(--s-special-ink)}
.st-교육{background:var(--s-edu)} .st-교육 select{color:var(--s-edu-ink)}
.st-지각,.st-조퇴,.st-외출{background:var(--s-late)} .st-지각 select,.st-조퇴 select,.st-외출 select{color:var(--s-late-ink)}
.st-결근{background:var(--s-bad)} .st-결근 select{color:var(--s-bad-ink)}
.st-예정{border-style:dashed} .st-예정 select{color:var(--muted)}
.st-확인{border:2px solid var(--warn)} .st-확인 select{color:var(--warn)}
.day select option{color:var(--ink);background:var(--panel)}

.scroll{overflow-x:auto;min-width:0}
table.t{border-collapse:collapse;width:100%;font-size:14px}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:6px 6px;text-align:left;vertical-align:middle}
table.t th{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap}
table.t td.num,table.t th.num{text-align:center}
table.t input{padding:4px 6px}
table.t input.n{width:56px;text-align:center}
table.t td.adj input{border-color:var(--accent)}
.kind{font-weight:600}
.counts{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.counts label{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--muted);text-align:center;min-width:0}
.counts input{text-align:center;font-weight:600;font-size:15px;padding:6px 2px}
.fare{font-size:15px}
.fare strong{font-size:17px}
.counts label.adj input{border-color:var(--accent);border-width:2px}
.preview{border:1px solid var(--accent);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:8px}
details > summary{cursor:pointer;font-weight:600;font-size:14px}
details[open] > summary{margin-bottom:10px}
.confirm{display:inline-flex;gap:6px;align-items:center}
@media (max-width:640px){
  .counts{grid-template-columns:repeat(4,minmax(0,1fr))}
  .day select{font-size:12px;padding:5px 0}
  h1{font-size:19px}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>복무요원 복무상황부</h1>
    <div class="row">
      <label class="muted" for="month">복무 연월</label>
      <input type="month" id="month">
      <button type="button" class="sm" id="deskBtn" hidden>바탕화면에 두기</button>
    </div>
  </header>

  <section class="panel" id="upPanel">
    <div class="band"><h2>근태현황 넣기 · 여러 요원 한꺼번에</h2><span class="tag" id="aiTag" hidden>사진도 읽음</span></div>
    <textarea id="pasteBox" rows="2" placeholder="포털 근태현황 표를 마우스로 끌어 선택 → Ctrl+C → 여기를 누르고 Ctrl+V" aria-label="근태현황 표 붙여 넣기"></textarea>
    <div id="drop" tabindex="0" role="button" aria-label="근태현황 그림이나 엑셀 파일 올리기">
      <strong id="dropMain">근태현황 그림(PNG)이나 엑셀 파일을 끌어 놓거나 눌러서 고르기</strong>
      <span class="muted" id="dropSub">엑셀이 없으면 아래 요원 달력에서 연가·병가 날만 눌러 바꾸면 됩니다</span>
      <input type="file" id="file" accept=".xlsx,.xls,.csv,image/*" multiple hidden>
    </div>
    <div class="status" id="upStatus"></div>
    <div class="row" id="scanRow" hidden>
      <button type="button" id="scanBtn">종이 복무상황부 스캔 올리기 (PDF·그림)</button>
      <input type="file" id="scanFile" accept=".pdf,application/pdf,image/*" multiple hidden>
    </div>
    <div id="preview" hidden></div>
  </section>

  <section class="panel">
    <div class="band"><h2>요원</h2><div class="row"><button id="addP" type="button" class="sm">+ 요원 추가</button></div></div>
    <div class="chips" id="chips"></div>
    <div id="person"></div>
  </section>

  <section class="panel">
    <div class="band"><h2 id="allTitle">보수명세서 근무상황</h2>
      <div class="row"><button id="copyAll" type="button" class="sm">숫자 모두 복사</button><button id="printAll" type="button" class="sm pri">전체 복무상황부 파일</button></div></div>
    <div class="scroll"><table class="t" id="allTable"></table></div>
    <div class="status" id="allStatus"></div>
  </section>

  <details class="panel" id="setBox">
    <summary>기본값·백업·바탕화면</summary>
    <div class="row">
      <label class="f">복무기관<input type="text" id="s_org"></label>
      <label class="f">복무분야<input type="text" id="s_field"></label>
      <label class="f">복무형태<input type="text" id="s_type"></label>
      <label class="f">근무지<input type="text" id="s_place"></label>
    </div>
    <div class="row">
      <label class="f">결재란 (쉼표로 구분)<input type="text" id="s_sign"></label>
      <label class="f">기본 직무수행 태도<input type="text" id="s_att"></label>
      <label class="f">연가·특휴 기본 사유<input type="text" id="s_reason"></label>
    </div>
    <div class="row">
      <label class="row muted"><input type="checkbox" id="s_sp"> 특별휴가를 연가일수에 넣기</label>
      <label class="row muted"><input type="checkbox" id="s_join"> 연가·병가도 이어진 날은 한 줄로</label>
    </div>
    <div class="row">
      <button id="bkSave" type="button">백업 파일 저장</button>
      <button id="bkLoad" type="button">백업 불러오기</button>
      <input type="file" id="bkFile" accept=".json,application/json" hidden>
      <span class="status" id="bkStatus"></span>
    </div>
    <div class="row" id="deskRow">
      <strong style="font-size:14px">바탕화면에서 열기</strong>
      <button type="button" class="pri" id="installBtn" hidden>바탕화면에 설치</button>
      <button type="button" id="fileBtn" hidden>파일로 내려받기</button>
      <button type="button" id="copyUrl">웹사이트 주소 복사</button>
      <span class="status" id="deskStatus"></span>
    </div>
    <div class="muted" id="deskHow"></div>
  </details>
</div>

<script>
"use strict";
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const KEY = "bokmu.v1";
const WEB = !window.claude;

/* 날짜 상태. 코드 → 화면 이름 */
const CODES = [["출근","출근"],["휴일","휴일"],["연가","연가"],["병가","병가"],["공병","공무상병가"],["특휴","특별휴가"],["교육","교육"],["지각","지각"],["조퇴","조퇴"],["외출","외출"],["결근","무단결근"],["예정","근무편성"],["확인","확인 필요"]];
const SHORT = {출근:"출근",휴일:"휴일",연가:"연가",병가:"병가",공병:"공병",특휴:"특휴",교육:"교육",지각:"지각",조퇴:"조퇴",외출:"외출",결근:"결근",예정:"예정",확인:"확인"};
/* 근무상황 표에 줄로 올라가는 상태와 종별 이름 */
const KIND = {연가:"연가",병가:"병가",공병:"공무상병가",특휴:"특별휴가",교육:"교육",지각:"지각",조퇴:"조퇴",외출:"외출",결근:"무단결근"};
/* 종이 양식 본인 칸에 미리 적는 글자 (출근한 날은 비워 두고 본인이 서명) */
const SELF = {휴일:"휴일",연가:"연가",병가:"병가",공병:"병가",특휴:"특휴",교육:"교육",지각:"지각",조퇴:"조퇴",외출:"외출",결근:"결근"};
/* 보수명세서 근무상황 칸 (R~X) */
const COLS = [["out","출근일수"],["annual","연가일수"],["sick","30일 이내 병가일수"],["edu","교육일수"],["awol","복무이탈일수"],["overA","연가초과 결근일수"],["overS","30일초과 병가일수"]];

/* 관공서 공휴일 (대체공휴일 포함). 틀린 날은 달력에서 직접 고칠 수 있음 */
const HOLI = {
  2025:["01-01","01-27","01-28","01-29","01-30","03-01","03-03","05-05","05-06","06-03","06-06","08-15","10-03","10-05","10-06","10-07","10-08","10-09","12-25"],
  2026:["01-01","02-16","02-17","02-18","03-01","03-02","05-05","05-24","05-25","06-03","06-06","08-15","08-17","09-24","09-25","09-26","09-28","10-03","10-05","10-09","12-25"],
  2027:["01-01","02-06","02-07","02-08","02-09","03-01","05-05","05-13","06-06","08-15","08-16","09-14","09-15","09-16","10-03","10-04","10-09","10-11","12-25","12-27"]
};

const pad = n => String(n).padStart(2, "0");
const ymParts = ym => ym.split("-").map(Number);
const dim = ym => { const [y,m] = ymParts(ym); return new Date(y, m, 0).getDate(); };
const wday = (ym, d) => { const [y,m] = ymParts(ym); return new Date(y, m-1, d).getDay(); };
const isHoli = (ym, d) => { const [y,m] = ymParts(ym); const w = wday(ym, d); return w === 0 || w === 6 || (HOLI[y] || []).includes(pad(m)+"-"+pad(d)); };
const fmtD = (ym, d) => { const [y,m] = ymParts(ym); return y+"."+pad(m)+"."+pad(d); };
const uid = () => "p" + Date.now().toString(36) + Math.random().toString(36).slice(2,6);

/* ---------- 저장 ---------- */
function blank(){
  return {v:1, set:{org:"",field:"",type:"주간",place:"",sign:"담당,사무국장,원장",att:"양호",reason:"개인사유",sp:true,join:false}, people:[], months:{}, ui:{}};
}
function norm(d){
  const b = blank();
  if (!d || typeof d !== "object") return b;
  d.set = Object.assign(b.set, d.set || {});
  d.people = Array.isArray(d.people) ? d.people.filter(p => p && p.id) : [];
  d.months = d.months && typeof d.months === "object" ? d.months : {};
  d.ui = d.ui && typeof d.ui === "object" ? d.ui : {};
  d.v = 1;
  return d;
}
let db = blank();
try { const raw = localStorage.getItem(KEY); if (raw) db = norm(JSON.parse(raw)); } catch (e) {}
let saveT = 0;
function saveNow(){ clearTimeout(saveT); saveT = 0; try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) {} }
function save(){ clearTimeout(saveT); saveT = setTimeout(saveNow, 200); }
/* 창을 닫거나 다른 창으로 갈 때 남은 저장을 바로 함 */
addEventListener("pagehide", () => { if (saveT) saveNow(); });
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden" && saveT) saveNow(); });

const now = new Date();
let cur = { ym: db.ui.ym || (now.getFullYear()+"-"+pad(now.getMonth()+1)), pid: db.ui.pid || "" };

const person = id => db.people.find(p => p.id === id);
function rec(ym, pid, make){
  if (!db.months[ym]) { if (!make) return null; db.months[ym] = {}; }
  if (!db.months[ym][pid]) { if (!make) return null; db.months[ym][pid] = {days:null, src:"", notes:{}, adj:{}, portal:null}; }
  const r = db.months[ym][pid];
  r.notes = r.notes || {}; r.adj = r.adj || {};
  return r;
}
function defDays(ym){ const o = {}; for (let d = 1; d <= dim(ym); d++) o[d] = isHoli(ym, d) ? "휴일" : "출근"; return o; }
function daysOf(ym, pid){ const r = rec(ym, pid); if (r && r.days) return r.days; return defDays(ym); }

/* ---------- 계산 ---------- */
function tally(days, ym){
  const c = {}; CODES.forEach(([k]) => c[k] = 0);
  for (let d = 1; d <= dim(ym); d++) c[days[d]] = (c[days[d]] || 0) + 1;
  return c;
}
function autoCounts(days, ym){
  const c = tally(days, ym);
  return {
    out: c.출근 + c.지각 + c.조퇴 + c.외출 + c.예정,
    annual: c.연가 + (db.set.sp ? c.특휴 : 0),
    sick: c.병가 + c.공병,
    edu: c.교육,
    awol: c.결근,
    overA: 0, overS: 0
  };
}
function counts(ym, pid){
  const a = autoCounts(daysOf(ym, pid), ym), r = rec(ym, pid), out = {};
  COLS.forEach(([k]) => out[k] = (r && r.adj && r.adj[k] != null && r.adj[k] !== "") ? Number(r.adj[k]) : a[k]);
  return {auto:a, val:out};
}
/* 교통비: 요원별 1일 교통비 × 출근일수(보수명세서와 같은 계산: 교통비 = 1일 교통비 × 출근일수) */
const won = n => Number(n || 0).toLocaleString("ko-KR");
const fareOf = p => { const n = Number(p && p.fare); return isFinite(n) && n > 0 ? Math.round(n) : 0; };
function fareLine(p, ym){
  const f = fareOf(p), out = counts(ym, p.id).val.out;
  return f ? "교통비 " + won(f) + "원 × 출근 " + out + "일 = <strong>" + won(f * out) + "원</strong>" : '<span class="muted">1일 교통비를 넣으면 이번 달 교통비가 나옵니다</span>';
}
/* 근무상황 표 줄: 교육·공무상병가는 이어진 날(사이 휴일 포함)을 한 줄로, 연가·병가 등은 하루씩 */
function rowsOf(ym, pid){
  const days = daysOf(ym, pid), N = dim(ym), r = rec(ym, pid), rows = [];
  const joinKinds = new Set(["교육","공병"]);
  if (db.set.join) ["연가","병가","특휴","결근"].forEach(k => joinKinds.add(k));
  let d = 1;
  while (d <= N) {
    const c = days[d];
    if (!KIND[c]) { d++; continue; }
    let end = d;
    if (joinKinds.has(c)) { let k = d + 1; while (k <= N && (days[k] === c || days[k] === "휴일")) { if (days[k] === c) end = k; k++; } }
    const key = c + "|" + d, note = (r && r.notes[key]) || {};
    const defReason = (c === "연가" || c === "특휴") ? db.set.reason : (c === "공병" ? "공무상병가" : "");
    rows.push({key, code:c, kind:KIND[c], s:d, e:end,
      period: note.p != null ? note.p : (end === d ? fmtD(ym, d) : fmtD(ym, d) + " ~ " + fmtD(ym, end)),
      reason: note.r != null ? note.r : defReason,
      att: note.a != null ? note.a : db.set.att});
    d = end + 1;
  }
  return rows;
}
/* 포털 합계와 날짜 목록 비교 */
function portalCheck(ym, pid){
  const r = rec(ym, pid); if (!r || !r.portal) return null;
  const p = r.portal, c = tally(daysOf(ym, pid), ym), diffs = [];
  const work = dim(ym) - c.휴일;
  const att = c.출근 + c.예정 + c.지각 + c.조퇴 + c.외출 + c.교육;
  const pairs = [["출근일수", p.workdays, work], ["정상·야간출근", (p.normal||0) + (p.night||0), att], ["연가", p.annual, c.연가], ["병가", p.sick, c.병가], ["병가(공무)", p.sickDuty, c.공병], ["무단결근", p.absent, c.결근], ["특별휴가", p.special, c.특휴]];
  pairs.forEach(([n, a, b]) => { if (a != null && Number(a) !== b) diffs.push(n + " " + a + "≠" + b); });
  return {p, diffs};
}

/* ---------- 화면 ---------- */
function paintChips(){
  const box = $("chips");
  if (!db.people.length) { box.innerHTML = '<span class="muted">사진을 올리면 합계표의 요원이 자동으로 추가됩니다. 직접 추가해도 됩니다.</span>'; return; }
  box.innerHTML = db.people.map(p => {
    const r = rec(cur.ym, p.id), dim = !(r && r.days);
    return '<button type="button" class="chip' + (p.id === cur.pid ? " on" : "") + (dim ? " dim" : "") + '" data-pid="' + p.id + '"' + (dim ? ' title="이번 달 날짜별 기록 없음"' : "") + '>' + esc(p.name || "이름 없음") + '</button>';
  }).join("");
}
function paintPerson(){
  const box = $("person"), p = person(cur.pid);
  if (!p) { box.innerHTML = ""; return; }
  const ym = cur.ym, r = rec(ym, p.id), days = daysOf(ym, p.id), N = dim(ym);
  const src = r && r.days ? (r.src === "사진" ? '<span class="tag ok">포털에서 가져옴</span>' : r.src === "스캔" ? '<span class="tag ok">종이 스캔에서 가져옴</span>' : '<span class="tag">직접 고침</span>') : '<span class="tag">달력 기본값</span>';
  const chk = portalCheck(ym, p.id);
  let chkHtml = "";
  if (chk) {
    const P = chk.p;
    chkHtml = '<div class="row muted">포털 합계: 출근일수 ' + (P.workdays ?? "-") + ' · 정상출근 ' + (P.normal ?? "-") + (P.night ? ' · 야간 ' + P.night : "") + ' · 연가 ' + (P.annual ?? 0) + ' · 병가 ' + (P.sick ?? 0) + (P.sickDuty ? ' · 병가(공무) ' + P.sickDuty : "") + (P.absent ? ' · 무단결근 ' + P.absent : "") + ' · 특별휴가 ' + (P.special ?? 0) +
      (chk.diffs.length ? ' <span class="tag warn">달력과 다름: ' + esc(chk.diffs.join(", ")) + '</span>' : ' <span class="tag ok">달력과 같음</span>') + '</div>';
  }
  const first = wday(ym, 1);
  let cal = ["일","월","화","수","목","금","토"].map((w,i) => '<div class="wd' + (i===0 ? " sun" : "") + '">' + w + '</div>').join("");
  for (let i = 0; i < first; i++) cal += '<div class="day blank"></div>';
  for (let d = 1; d <= N; d++) {
    const c = days[d] || "출근";
    cal += '<div class="day st-' + c + '"><span class="n">' + d + '</span><select data-day="' + d + '" aria-label="' + d + '일">' +
      CODES.map(([k, n]) => '<option value="' + k + '"' + (k === c ? " selected" : "") + '>' + (k === c ? SHORT[k] : n) + '</option>').join("") + '</select></div>';
  }
  const rows = rowsOf(ym, p.id);
  const rowsHtml = rows.length ? rows.map(x => '<tr data-key="' + esc(x.key) + '"><td class="kind">' + esc(x.kind) + '</td><td><input type="text" data-f="p" value="' + esc(x.period) + '" aria-label="기간"></td><td><input type="text" data-f="r" value="' + esc(x.reason) + '" aria-label="사유"></td><td><input type="text" data-f="a" value="' + esc(x.att) + '" aria-label="직무수행 태도"></td></tr>').join("")
    : '<tr><td colspan="4" class="muted">이번 달에는 적을 근무상황이 없습니다.</td></tr>';
  const cn = counts(ym, p.id);
  const cnt = COLS.map(([k, n]) => { const adj = r && r.adj[k] != null && r.adj[k] !== ""; return '<label class="' + (adj ? "adj" : "") + '">' + n + '<input type="number" min="0" data-c="' + k + '" value="' + cn.val[k] + '"></label>'; }).join("");
  const anyAdj = r && Object.keys(r.adj).some(k => r.adj[k] != null && r.adj[k] !== "");
  const [y, m] = ymParts(ym);
  box.innerHTML =
    '<div class="row" style="justify-content:space-between"><h2>' + esc(p.name || "이름 없음") + ' · ' + y + '년 ' + m + '월</h2>' +
      '<div class="row">' + src + '<button type="button" class="sm" id="printOne">복무상황부 파일</button><span id="delWrap"><button type="button" class="sm danger" id="delP">요원 삭제</button></span></div></div>' +
    '<div class="row">' +
      '<label class="f">성명<input type="text" id="p_name" value="' + esc(p.name) + '"></label>' +
      '<label class="f">연락처<input type="tel" id="p_phone" value="' + esc(p.phone || "") + '"></label>' +
      '<label class="f">복무기관<input type="text" id="p_org" value="' + esc(p.org || "") + '" placeholder="' + esc(db.set.org) + '"></label>' +
      '<label class="f">복무분야<input type="text" id="p_field" value="' + esc(p.field || "") + '" placeholder="' + esc(db.set.field) + '"></label>' +
      '<label class="f">복무형태<input type="text" id="p_type" value="' + esc(p.type || "") + '" placeholder="' + esc(db.set.type) + '"></label>' +
      '<label class="f">근무지<input type="text" id="p_place" value="' + esc(p.place || "") + '" placeholder="' + esc(db.set.place) + '"></label>' +
      '<label class="f" style="flex:0 1 180px">1일 교통비(원)<input type="number" id="p_fare" min="0" step="100" inputmode="numeric" value="' + (fareOf(p) || "") + '" placeholder="예: 3300"></label>' +
    '</div>' +
    '<div id="pzone" tabindex="0" role="button" aria-label="' + esc(p.name) + ' 님 근태현황 캡처 붙여 넣기">' +
      '<span class="pz-t"><strong>' + esc(p.name || "이 요원") + ' 님 근태 캡처 넣기</strong><span class="muted">포털에서 ' + esc(p.name || "이 요원") + ' 님을 누르고 캡처 → 이 칸을 누르고 Ctrl+V (PNG 끌어 놓기도 됨) <span class="pz-ready">· 붙여 넣을 준비 완료</span></span></span>' +
      '<span class="row"><button type="button" class="sm" id="pPick">그림 파일 고르기</button><input type="file" id="pfile" accept="image/*" hidden></span></div>' +
    (pMsg && pMsg.pid === p.id ? '<div class="pmsg' + (pMsg.err ? " err" : "") + '" id="pMsg">' + pMsg.html + '</div>' : "") +
    '<div class="row" style="justify-content:space-between"><h3>날짜별 근무</h3><button type="button" class="sm" id="resetDays">달력 기본값으로</button></div>' +
    chkHtml +
    '<div class="cal" id="cal">' + cal + '</div>' +
    '<h3>근무상황</h3>' +
    '<div class="scroll"><table class="t" id="rows"><thead><tr><th>종별</th><th>기간 또는 일시</th><th>사유 또는 용무</th><th>직무수행 태도</th></tr></thead><tbody>' + rowsHtml + '</tbody></table></div>' +
    '<div class="row" style="justify-content:space-between"><h3>보수명세서 근무상황</h3><div class="row">' + (anyAdj ? '<span class="tag">직접 고친 칸 있음</span><button type="button" class="sm" id="adjReset">자동 계산으로</button>' : "") + '<button type="button" class="sm" id="copyOne">숫자 복사</button></div></div>' +
    '<div class="counts" id="counts">' + cnt + '</div>' +
    '<div class="fare" id="fareLine">' + fareLine(p, ym) + '</div>' +
    '<div class="status" id="pStatus"></div>';
}
function paintAll(){
  const ym = cur.ym, [y, m] = ymParts(ym);
  $("allTitle").textContent = m + "월 보수명세서 근무상황";
  if (!db.people.length) { $("allTable").innerHTML = '<tbody><tr><td class="muted">요원이 없습니다.</td></tr></tbody>'; return; }
  let h = '<thead><tr><th>순서</th><th>성명</th>' + COLS.map(([, n]) => '<th class="num">' + n.replace("30일 이내 ", "").replace("30일초과 ", "30일초과<br>") + '</th>').join("") + '<th class="num">1일<br>교통비</th><th class="num">교통비</th><th>포털</th></tr></thead><tbody>';
  let fareSum = 0;
  db.people.forEach((p, i) => {
    const cn = counts(ym, p.id).val, chk = portalCheck(ym, p.id), r = rec(ym, p.id);
    const st = !(r && r.days) ? '<span class="tag">기본값</span>' : (chk ? (chk.diffs.length ? '<span class="tag warn">다름</span>' : '<span class="tag ok">같음</span>') : "");
    h += '<tr><td style="white-space:nowrap"><button type="button" class="sm" data-up="' + p.id + '" aria-label="위로"' + (i===0 ? " disabled" : "") + '>▲</button> <button type="button" class="sm" data-down="' + p.id + '" aria-label="아래로"' + (i===db.people.length-1 ? " disabled" : "") + '>▼</button></td><td>' + esc(p.name) + '</td>' +
      COLS.map(([k]) => '<td class="num">' + cn[k] + '</td>').join("") +
      '<td class="num">' + (fareOf(p) ? won(fareOf(p)) : '<span class="muted">-</span>') + '</td><td class="num">' + (fareOf(p) ? won(fareOf(p) * cn.out) : '<span class="muted">-</span>') + '</td><td>' + st + '</td></tr>';
    fareSum += fareOf(p) * cn.out;
  });
  h += '<tr><td></td><td><strong>합계</strong></td>' + COLS.map(() => '<td></td>').join("") + '<td></td><td class="num"><strong>' + won(fareSum) + '</strong></td><td></td></tr>';
  $("allTable").innerHTML = h + '</tbody>';
}
function paintSet(){
  const s = db.set;
  $("s_org").value = s.org; $("s_field").value = s.field; $("s_type").value = s.type; $("s_place").value = s.place;
  $("s_sign").value = s.sign; $("s_att").value = s.att; $("s_reason").value = s.reason; $("s_sp").checked = !!s.sp; $("s_join").checked = !!s.join;
}
function paint(){
  if (cur.pid && !person(cur.pid)) cur.pid = "";
  if (!cur.pid && db.people.length) cur.pid = db.people[0].id;
  db.ui.ym = cur.ym; db.ui.pid = cur.pid;
  $("month").value = cur.ym;
  paintChips(); paintPerson(); paintAll(); save();
}

/* ---------- 요원 화면 이벤트 ---------- */
$("month").addEventListener("change", e => { if (/^\d{4}-\d{2}$/.test(e.target.value)) { cur.ym = e.target.value; paint(); } });
$("chips").addEventListener("click", e => { const b = e.target.closest("[data-pid]"); if (b) { cur.pid = b.dataset.pid; pMsg = null; pPending = null; paint(); } });
$("addP").addEventListener("click", () => {
  const p = {id:uid(), name:"새 요원", phone:"", org:"", field:"", type:"", place:""};
  db.people.push(p); cur.pid = p.id; paint();
  const n = $("p_name"); if (n) { n.focus(); n.select(); }
});
$("person").addEventListener("change", e => {
  const t = e.target, p = person(cur.pid); if (!p) return;
  if (t.dataset.day) {
    const r = rec(cur.ym, p.id, true);
    if (!r.days) r.days = Object.assign({}, defDays(cur.ym));
    r.days[t.dataset.day] = t.value; if (r.src !== "사진") r.src = "직접";
    paint(); return;
  }
  if (t.dataset.c) {
    const r = rec(cur.ym, p.id, true), a = counts(cur.ym, p.id).auto[t.dataset.c];
    if (t.value === "" || Number(t.value) === a) delete r.adj[t.dataset.c]; else r.adj[t.dataset.c] = Math.max(0, Math.round(Number(t.value)));
    paintPerson(); paintAll(); save(); return;
  }
});
$("person").addEventListener("input", e => {
  const t = e.target, p = person(cur.pid); if (!p) return;
  const map = {p_name:"name", p_phone:"phone", p_org:"org", p_field:"field", p_type:"type", p_place:"place"};
  if (map[t.id]) { p[map[t.id]] = t.value; save(); if (t.id === "p_name") { paintChips(); paintAll(); } return; }
  if (t.id === "p_fare") { p.fare = t.value === "" ? "" : Math.max(0, Math.round(Number(t.value) || 0)); save(); $("fareLine").innerHTML = fareLine(p, cur.ym); paintAll(); return; }
  if (t.dataset.f) {
    const tr = t.closest("tr"), r = rec(cur.ym, p.id, true), key = tr.dataset.key;
    r.notes[key] = r.notes[key] || {}; r.notes[key][t.dataset.f] = t.value; save();
  }
});
$("person").addEventListener("click", async e => {
  const id = e.target.id, p = person(cur.pid); if (!p) return;
  if (id === "resetDays") { const r = rec(cur.ym, p.id); if (r) { r.days = null; r.src = ""; } paint(); }
  else if (id === "adjReset") { const r = rec(cur.ym, p.id); if (r) r.adj = {}; paint(); }
  else if (id === "copyOne") { const v = counts(cur.ym, p.id).val; await copyText(COLS.map(([k]) => v[k]).join("\t"), $("pStatus"), "복사했습니다. 보수명세서의 해당 요원 ‘출근일수’ 칸을 누르고 붙여 넣으세요."); }
  else if (id === "printOne") { await saveForms([p], $("pStatus")); }
  else if (id === "delP") {
    $("delWrap").innerHTML = '<span class="confirm"><span class="muted">' + esc(p.name) + ' 님의 모든 달 기록을 지울까요?</span><button type="button" class="sm danger" id="delYes">지우기</button><button type="button" class="sm" id="delNo">그대로 두기</button></span>';
  }
  else if (id === "delYes") {
    db.people = db.people.filter(x => x.id !== p.id);
    Object.values(db.months).forEach(mo => { delete mo[p.id]; });
    cur.pid = ""; paint();
  }
  else if (id === "delNo") paintPerson();
});

/* 전체 표 */
$("allTable").addEventListener("click", e => {
  const up = e.target.closest("[data-up]"), dn = e.target.closest("[data-down]");
  const id = up ? up.dataset.up : dn ? dn.dataset.down : null; if (!id) return;
  const i = db.people.findIndex(p => p.id === id), j = up ? i - 1 : i + 1;
  if (j < 0 || j >= db.people.length) return;
  [db.people[i], db.people[j]] = [db.people[j], db.people[i]]; paint();
});
$("copyAll").addEventListener("click", () => {
  const txt = db.people.map(p => { const v = counts(cur.ym, p.id).val; return COLS.map(([k]) => v[k]).join("\t"); }).join("\n");
  copyText(txt, $("allStatus"), "복사했습니다. 표의 순서가 보수명세서 요원 순서와 같은지 확인한 뒤, 첫 요원의 ‘출근일수’ 칸에 붙여 넣으세요.");
});
$("printAll").addEventListener("click", () => saveForms(db.people, $("allStatus")));

/* 기본값 */
[["s_org","org"],["s_field","field"],["s_type","type"],["s_place","place"],["s_sign","sign"],["s_att","att"],["s_reason","reason"]].forEach(([id, k]) => $(id).addEventListener("input", e => { db.set[k] = e.target.value; save(); paintPerson(); }));
$("s_sp").addEventListener("change", e => { db.set.sp = e.target.checked; paint(); });
$("s_join").addEventListener("change", e => { db.set.join = e.target.checked; paint(); });

async function copyText(txt, statusEl, okMsg){
  try { await navigator.clipboard.writeText(txt); statusEl.textContent = okMsg; statusEl.className = "status"; }
  catch (e) {
    statusEl.innerHTML = '복사가 막혔습니다. 아래 글을 선택해 Ctrl+C 하세요.<br><textarea readonly style="min-height:60px">' + esc(txt) + '</textarea>';
    const ta = statusEl.querySelector("textarea"); ta.focus(); ta.select();
  }
}

/* ---------- 파일 내려받기 ---------- */
let downloads = null;
async function saveFile(name, data, type, statusEl){
  if (downloads) {
    try { await downloads.save({filename:name, data}); statusEl.textContent = name + " 파일을 저장했습니다."; statusEl.className = "status"; }
    catch (e) { statusEl.textContent = e && e.code === "declined" ? "저장을 취소했습니다." : "파일을 저장하지 못했습니다."; statusEl.className = "status err"; }
    return;
  }
  try {
    const url = URL.createObjectURL(new Blob([data], {type}));

    const fit = pool.filter(s => s.workdays === work && s.annual === (c.연가 || 0) && s.sick === (c.병가 || 0) && s.sickDuty === (c.공병 || 0) && s.special === (c.특휴 || 0) && s.absent === (c.결근 || 0));

      if (k) { out.daily[""].push({date: toISO(cells[di]), kind: k}); return; }
    }
    /* 성명 = 첫 숫자 칸 바로 앞쪽의 한글 칸 (그 앞의 근무지는 건너뜀) */
    const fi = cells.findIndex(c => /^\d+$/.test(c));
    let ni = -1; for (let k = (fi < 0 ? cells.length : fi) - 1; k >= 0; k--) if (/^[가-힣]{2,5}$/.test(cells[k]) && !/근무지|성명|합계/.test(cells[k])) { ni = k; break; }
    if (ni < 0) return;
    const nums = cells.slice(ni + 1).filter(c => /^\d+$/.test(c));
    if (nums.length < 8) return;
    const last = nums.slice(-8).map(Number), o = {name: cells[ni]};
    KEYS.forEach((k, i) => o[k] = last[i]);
    out.summary.push(o);
  });
  if (!out.daily[""].length) delete out.daily[""];
  return out;
}
function gridsFrom(html, text){
  const grids = [];
  if (/<table/i.test(html)) {
    try {
      const doc = new DOMParser().parseFromString(html, "text/html");
      doc.querySelectorAll("table").forEach(t => {
        const g = [...t.querySelectorAll("tr")].filter(tr => tr.closest("table") === t)
          .map(tr => [...tr.children].filter(c => /^T[DH]$/.test(c.tagName)).flatMap(c => [c.textContent.replace(/\s+/g, " ").trim()].concat(Array(Math.max(0, (+c.colSpan || 1) - 1)).fill(""))));
        if (g.length) grids.push(g);
      });
    } catch (e) {}
  }
  if (!grids.length && text.trim()) grids.push(text.split(/\r?\n/).map(l => l.split(/\t| {2,}/)));
  return grids;
}
function readPasted(html, text){
  if (reading) return;
  const merged = {summary:[], daily:{}};
  const add = p => { merged.summary.push(...p.summary); Object.keys(p.daily).forEach(n => { (merged.daily[n] = merged.daily[n] || []).push(...p.daily[n]); }); };
  gridsFrom(html, text).forEach(g => { const p = parseGrid(g); if (p.summary.length || Object.keys(p.daily).length) add(p); else add(parseLoose(g)); });
  const rs = sheetResults(merged);
  if (!rs.length) { setUp("붙여 넣은 내용에서 근태 표를 찾지 못했습니다. 포털 근태현황의 표 부분을 끌어 선택해 다시 복사해 주세요.", true); return; }
  rs.forEach(r => addResult(r));
  results.forEach(r => { if (r.days.length && r.target.startsWith("new:") && r.target.length <= 4) r.target = matchTarget(r); });
  paintPreview();
  setUp("읽었습니다. 다른 요원 표도 이어서 붙여 넣을 수 있습니다. 다 넣었으면 ‘달력에 채우기’를 누르세요.");
}
function sheetResults(parsed){
  const list = [], ymOf = days => { const c = {}; days.forEach(x => { const k = x.date.slice(0, 7); c[k] = (c[k] || 0) + 1; }); return Object.keys(c).sort((a, b) => c[b] - c[a])[0] || ""; };
  const names = Object.keys(parsed.daily);
  const sumYm = names.length ? ymOf([].concat(...names.map(n => parsed.daily[n]))) : "";
  if (!names.length && parsed.summary.length) list.push({summary:parsed.summary, days:[], ym:"", selected:""});
  names.forEach((n, i) => {
    const days = parsed.daily[n];
    list.push({summary: i === 0 ? parsed.summary : [], days, ym: ymOf(days) || sumYm, selected: n});
  });
  if (list.length && !list[0].ym && sumYm) list[0].ym = sumYm;
  return list;
}
async function readSheets(files){
  if (reading) return;
  reading = true; results = []; paintPreview();
  setUp("엑셀 파일을 읽는 중…");
  const errs = [];
  let X;
  try { X = await loadXLSX(); }
  catch (e) { reading = false; setUp("엑셀을 읽는 도구를 불러오지 못했습니다. 인터넷 연결을 확인하고 다시 올려 주세요.", true); return; }
  for (const f of files) {
    try {
      const wb = X.read(new Uint8Array(await f.arrayBuffer()), {type:"array", cellDates:true});
      const merged = {summary:[], daily:{}};
      wb.SheetNames.forEach(sn => {
        const g = X.utils.sheet_to_json(wb.Sheets[sn], {header:1, raw:true, defval:""});
        const p = parseGrid(g);
        merged.summary.push(...p.summary);
        Object.keys(p.daily).forEach(n => { (merged.daily[n] = merged.daily[n] || []).push(...p.daily[n]); });
      });
      const rs = sheetResults(merged);
      if (!rs.length) throw new Error("empty");
      rs.forEach(r => addResult(r));
    } catch (e) { errs.push(f.name); }
  }
  reading = false;
  paintPreview();
  if (results.length) setUp(errs.length ? errs.join(", ") + "에서 근태 표를 찾지 못했습니다." : "다 읽었습니다. 맞는지 보고 ‘달력에 채우기’를 누르세요.", !!errs.length);
  else setUp("파일에서 근태 표를 찾지 못했습니다. 포털 근태현황에서 받은 엑셀인지 확인해 주세요. 맞는데도 안 되면 그 파일을 알려 주세요.", true);
}

/* ---------- 바탕화면에서 열기 ----------
   웹사이트판: 엣지·크롬의 앱 설치(바탕화면 아이콘, 주소창 없는 창, 기록·새 기능 그대로) 또는 이 파일 내려받기.
   바로가기 파일(.url)은 윈도우가 열 때마다 보안 경고를 띄워 만들지 않음 */
const SITE = "https://minseok3773.github.io/yakkuk/bokmu/";
const ONLINE = /^https?:$/.test(location.protocol) && !window.claude;
const STANDALONE = window.matchMedia && matchMedia("(display-mode: standalone)").matches;
let installEvt = null;
if (ONLINE) {
  const add = (rel, href, extra) => { const l = document.createElement("link"); l.rel = rel; l.href = href; Object.assign(l, extra || {}); document.head.append(l); };
  add("manifest", "manifest.webmanifest"); add("icon", "icon-192.png", {type:"image/png"}); add("apple-touch-icon", "icon-192.png");
  const m = document.createElement("meta"); m.name = "theme-color"; m.content = "#2c4677"; document.head.append(m);
  /* 엣지·크롬이 설치할 수 있는 앱으로 알아보게 함(저장 없이 그대로 받아 오는 서비스 워커) */
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js", {scope: "./"}).catch(() => {});
}
function paintDesk(){
  $("deskBtn").hidden = !ONLINE || STANDALONE;

    : !ONLINE ? "바탕화면에서 쓰려면 웹사이트 주소(" + SITE + ")를 엣지나 크롬으로 열고 이 칸의 ‘바탕화면에 설치’를 누르세요."
    : (installEvt ? "‘바탕화면에 설치’를 누르면 바탕화면에 아이콘이 생기고, 주소창 없는 창으로 열립니다. 기록과 새 기능은 이 웹사이트와 같습니다."
       : "단추가 없으면 엣지: 오른쪽 위 ⋯ → 앱 → ‘이 사이트를 앱으로 설치’ → 설치 → ‘바탕 화면 바로 가기 만들기’ 체크 → 허용. 크롬: ⋮ → 전송, 저장 및 공유 → 바로가기 만들기 → ‘창으로 열기’ 체크.") +
      " ‘파일로 내려받기’는 바탕화면 파일을 두 번 눌러 엽니다. 다만 기록이 이 웹사이트와 따로 저장되고, 새 기능이 반영되지 않으며, 그림·엑셀 읽기는 인터넷이 있어야 됩니다.";
}
addEventListener("beforeinstallprompt", e => { e.preventDefault(); installEvt = e; paintDesk(); });
addEventListener("appinstalled", () => { installEvt = null; paintDesk(); $("deskStatus").textContent = "바탕화면에 설치했습니다."; $("deskStatus").className = "status"; });
$("deskBtn").addEventListener("click", () => { const d = $("setBox"); d.open = true; d.scrollIntoView({behavior:"smooth", block:"start"}); });
$("installBtn").addEventListener("click", async () => {

});
$("fileBtn").addEventListener("click", async () => {
  try {
    const res = await fetch(location.pathname.replace(/[^/]*$/, "") + "index.html", {cache:"no-store"});

    await saveFile("복무상황부.html", await res.text(), "text/html", $("deskStatus"));
  } catch (e) { $("deskStatus").textContent = "파일을 만들지 못했습니다. 인터넷 연결을 확인해 주세요."; $("deskStatus").className = "status err"; }

$("copyUrl").addEventListener("click", () => copyText(SITE, $("deskStatus"), "주소를 복사했습니다: " + SITE));
paintDesk();

paintSet();
paint();
