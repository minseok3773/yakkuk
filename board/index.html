:root{

}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#111817; --surface:#1a2322; --ink:#e5edeb; --muted:#9aaba8; --line:#2f3c3a;
    --accent:#5cc4b6; --accent-ink:#0b1a18; --note-bg:#1e2d2b;

:root[data-theme="dark"]{

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55}

@media (max-width:640px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}

.rows{display:flex;flex-direction:column}

.pair{display:flex;gap:10px;flex-wrap:wrap}
.pair label{display:flex;flex-direction:column;gap:4px;font-size:13.5px;font-weight:500;flex:1 1 140px}
.conds{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:4px 10px}

.combo{border-left:4px solid var(--line);padding:4px 0 4px 12px;display:flex;flex-direction:column;gap:3px}
.combo.hi{border-color:var(--crit)} .combo.mid{border-color:var(--warn)}
.combo-top{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-weight:500}
details.care{border:1px solid var(--line);border-radius:8px;padding:9px 12px}

details.care summary > * + *{margin-left:8px}
.care-body{display:flex;flex-direction:column;gap:6px;padding-top:8px;font-size:14.5px}

/* 혈압·체중·혈당 */
.vform{display:flex;gap:8px 14px;flex-wrap:wrap;align-items:center}
.vform input{width:86px}
.vform input[type=date]{width:auto}
.vform select{width:auto}
.vlist{display:flex;flex-direction:column}

.vitem:first-child{border-top:0}

.gitem h3{font-size:16px;color:var(--ink)}

.ask-paste{display:flex;flex-direction:column;gap:8px;border:1px dashed var(--line);border-radius:8px;padding:10px}
.ask-paste textarea{min-height:80px;font-size:13.5px}
.ask-paste details.alt summary{cursor:pointer;font-size:13px;font-weight:500;color:var(--accent)}
.ask-paste details.alt[open] summary{margin-bottom:8px}
.vrow{display:flex;gap:8px 14px;flex-wrap:wrap;align-items:center}
.vrow input{width:86px}
.vrow select{width:auto}
.vbp,.vwt{display:flex;gap:5px;align-items:center}

/* 인쇄 */
#print{display:none}
@media print{
  body{background:#fff;color:#000}

}

  const n = document.createElement(tag);

    const v = attrs[k];

    if (k === "class") n.className = v;
    else if (k === "text") n.textContent = v;
    else if (k === "on") for (const ev in v) n.addEventListener(ev, v[ev]);
    else n.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat()){ if (c == null || c === false) continue; n.append(c.nodeType ? c : document.createTextNode(String(c))); }
  return n;
}

{"k":["tianeptine"],"ko":["티아넵틴"],"br":["스타브론"],"cls":"항우울제(기타)","use":"주요 우울 삽화 (프랑스 허가 기준)","se":["구역","변비","복통·속쓰림","졸림","두통","입 마름","어지럼","불면·악몽","식욕부진","빠른 맥박·두근거림"],"warn":"남용·의존이 생길 수 있음(특히 50세 미만이고 약물·알코올 의존 병력이 있는 경우). 우울증 치료 초기와 용량을 바꿀 때 자살 생각·행동이 늘 수 있어 가까이 살핌(25세 미만에서 위험 증가). 저나트륨혈증, 혼동·환각 보고. 15세 미만에는 쓰지 않음.","care":"정해진 양보다 더 먹거나 약을 더 달라고 하는지 살핌(남용 신호). 초기 몇 주와 용량이 바뀔 때 기분·자살 생각·평소와 다른 행동을 살피고 바로 연계. 두근거림, 졸림·어지럼(낙상)도 살핌.","id":"65411280","dt":"201309","n":"프랑스 허가사항(STABLON 12,5 mg RCP)","src":"fr","url":"https://base-donnees-publique.medicaments.gouv.fr/medicament/65411280/extrait#tab-rcp"},
{"k":["agomelatine"],"ko":["아고멜라틴"],"br":[],"cls":"항우울제(멜라토닌 작용제)","use":"성인의 주요 우울 삽화 (영국 허가 기준)","se":["두통","구역","어지럼","졸림","불면","불안","이상한 꿈","설사·변비·복통","간 수치(ALT·AST) 상승","허리 통증·피로"],"warn":"간 손상(드물게 간부전) 보고. 시작 전과 약 3주·6주·12주·24주, 용량을 올릴 때 간 기능 검사를 함. 간경변·활동성 간질환이나 간 수치가 정상의 3배를 넘으면 쓰지 않음. 강한 CYP1A2 억제제(플루복사민, 시프로플록사신)와 함께 쓰지 않음. 75세 이상, 치매가 있는 노인의 우울증에는 쓰지 않음. 조증이 나타나면 중단. 자살 생각·행동을 살핌.","care":"간 기능 검사 날짜를 달력에 적고 거르지 않도록 함. 소변이 진해짐·대변 색이 옅어짐·피부나 눈이 노래짐·오른쪽 윗배 통증·이유 모를 피로가 계속되면 바로 알림. 술을 많이 마시는지, 플루복사민을 함께 먹는지 확인. 초기 몇 주 기분 변화를 살핌.","id":"6564","dt":"20260415","n":"영국 허가사항(Valdoxan 25 mg SmPC)","src":"uk","url":"https://www.medicines.org.uk/emc/product/6564/smpc"},
{"k":["milnacipran"],"ko":["밀나시프란"],"br":["익셀"],"cls":"항우울제(SNRI)","use":"성인의 주요 우울 삽화 (프랑스 허가 기준)","se":["구역","두통","어지럼·떨림","불안·초조·잠 문제","빠른 맥박·두근거림","혈압 상승·얼굴 화끈거림","땀이 많이 남","변비·복통","소변 보기 어려움","사정 장애"],"warn":"자살 생각·행동이 치료 초기와 용량을 바꿀 때 늘 수 있음(25세 미만에서 위험 증가). 혈압과 맥박을 올릴 수 있어 조절되지 않는 고혈압, 심하거나 불안정한 관상동맥 질환에는 쓰지 않음. 비가역적 MAO 억제제와 함께 쓰지 않음. 세로토닌 증후군, 출혈 경향, 저나트륨혈증, 소변 저류(전립선비대), 폐쇄각 녹내장, 경련 병력 주의. 수유 중에는 쓰지 않음.","care":"초기 몇 주와 용량이 바뀔 때 기분·자살 생각을 살피고 바로 연계. 혈압·맥박을 정기적으로 재고, 소변 보기 어려움(특히 남성)을 살핌. 다른 세로토닌 약(다른 항우울제, 트라마돌 등)과 겹치는지 확인. 갑자기 끊지 않도록 약속.","id":"60430095","dt":"20261103","n":"프랑스 허가사항(MILNACIPRAN ARROW 25 mg RCP, 데이터베이스 갱신일 기준)","src":"fr","url":"https://base-donnees-publique.medicaments.gouv.fr/medicament/60430095/extrait#tab-rcp"},

const lvRank = {"높음":0,"보통":1,"참고":2};
function ingsOf(d){ return arr(d.ingredient_en).map(x => " " + str(x).toLowerCase().trim() + " "); }
function hit(d, list){ const I = ingsOf(d); return list.some(t => I.some(i => i.includes(" " + t + " "))); }
function localCheck(drugs){
  const pairs = [], seen = new Set();
  for (const r of RULES){
    for (let i = 0; i < drugs.length; i++) for (let j = 0; j < drugs.length; j++){
      if (i === j || !hit(drugs[i], r.a) || !hit(drugs[j], r.b)) continue;
      const key = [Math.min(i,j), Math.max(i,j), r.msg].join("|");
      if (seen.has(key)) continue; seen.add(key);
      pairs.push({lv:r.lv, src:r.src, names:[str(drugs[i].input), str(drugs[j].input)], msg:r.msg});
    }
  }
  const byIng = {};
  drugs.forEach(d => new Set(arr(d.ingredient_en).map(x => str(x).toLowerCase().trim())).forEach(k => { if (k) (byIng[k] = byIng[k] || []).push(str(d.input)); }));
  const dept = s => { const m = str(s).match(/\(([^()]*)\)\s*$/); return m ? m[1].trim() : ""; };
  for (const k in byIng) if (byIng[k].length > 1){
    const ds = byIng[k].map(dept), same = ds[0] && ds.every(x => x === ds[0]);
    pairs.push(same
      ? {lv:"보통", src:"P", names:byIng[k], msg:"같은 성분(" + k + ")이 같은 진료과에서 2번 이상 들어 있음. 용량을 나눠 먹는 처방일 수 있으니 하루 총량과 복용 시간을 확인."}
      : {lv:"높음", src:"P", names:byIng[k], msg:"같은 성분(" + k + ")이 2번 이상 들어 있음. 서로 다른 진료과의 중복 처방인지 확인."});
  }
  pairs.sort((x, y) => lvRank[x.lv] - lvRank[y.lv]);
  const names = list => drugs.filter(d => hit(d, list)).map(d => str(d.input));
  const burdens = [];
  /* 같은 약을 용량만 달리 두 줄로 적은 경우는 한 가지로 셈 */
  const kinds = list => new Set(drugs.filter(d => hit(d, list)).map(d => ingsOf(d).sort().join("+"))).size;
  const add = (list, min, title, msg) => { if (kinds(list) >= min) burdens.push({title, names:names(list), msg}); };
  add(G.achol, 2, "항콜린 작용이 겹침", "변비, 소변 보기 어려움, 입 마름, 시야 흐림, 기억력·집중력 저하가 커질 수 있음.");
  add(sedative, 3, "졸리게 하는 약이 3가지 이상", "낮 졸림, 낙상, 프로그램 참여 저하가 커질 수 있음.");
  add(qt, 2, "심장 리듬(QT)에 영향을 주는 약이 겹침", "심전도 검사 여부를 주치의에게 확인. 실신, 두근거림을 관찰.");
  add(ortho, 2, "혈압을 떨어뜨릴 수 있는 약이 겹침", "일어설 때 어지럼, 낙상을 관찰.");
  add(G.bzd, 2, "안정제·수면제가 2가지 이상", "같은 효능의 중복인지 확인. 낮 졸림, 낙상, 의존을 관찰.");
  add(G.ap, 2, "항정신병약이 2가지 이상", "흔히 있는 처방이지만 부작용이 더해질 수 있음. 움직임, 졸림, 체중 변화를 관찰.");
  const labs = LABS.map(l => ({names:names(l.list), msg:l.msg})).filter(x => x.names.length);
  const skipped = drugs.filter(d => arr(d.ingredient_en).every(x => !str(x).trim())).map(d => str(d.input));
  return {pairs, burdens, labs, skipped};
}

let lastConds = [], lastAge = "";
function condCheck(drugs){
  const out = [];
  const run = (label, rules) => rules.forEach(r => { const n = drugs.filter(d => hit(d, r.list)).map(d => str(d.input)); if (n.length) out.push({lv:r.lv, cond:label, names:n, msg:r.msg}); });
  CONDS.filter(c => lastConds.includes(c.id)).forEach(c => run(c.label, c.rules));
  if (lastAge === "60대" || lastAge === "70대 이상") run(lastAge === "60대" ? "노인 주의 (65세 이상이면 해당)" : "노인 주의", ELDER);
  out.sort((x, y) => lvRank[x.lv] - lvRank[y.lv]);
  return out;
}

const RULE_KO = {};
const NAMES = [];
OFFICIAL.forEach(o => { o.ko.forEach(n => NAMES.push([n, o, false])); arr(o.br).forEach(n => NAMES.push([n, o, true])); o.k.forEach(n => NAMES.push([n, o, true])); });
RULE_NAMES.forEach(([k, ko, br]) => {
  RULE_KO[k] = ko[0].replace(/^\^/, "");
  ko.forEach(n => NAMES.push([n.replace(/^\^/, ""), k, n[0] === "^"])); br.forEach(n => NAMES.push([n, k, true])); NAMES.push([k, k, true]);

NAMES.sort((a, b) => b[0].length - a[0].length);
/* 줄에 적힌 이름을 긴 것부터 맞춤. off = 내장 약 정보, rule = 이름표로만 알아본 성분(영문). 이름표의 이름도 같이 맞춰 '덱시부프로펜'이 '이부프로펜'으로 읽히지 않게 함 */
function scanNames(line){
  let s = " " + str(line).toLowerCase() + " ";
  const off = [], rule = [];
  for (const [n, o, headOnly] of NAMES){
    let i = s.indexOf(n);
    while (i >= 0 && headOnly && /[a-z가-힣]/.test(s[i - 1])) i = s.indexOf(n, i + 1);
    if (i < 0) continue;
    s = s.slice(0, i) + " ".repeat(n.length) + s.slice(i + n.length);
    const to = typeof o === "string" ? rule : off;
    if (!to.includes(o)) to.push(o);
  }
  return {off, rule};
}

function factLine(o){ return "- " + o.ko[0] + " (" + o.cls + "): 쓰임 " + o.use + " / 흔한 부작용 " + o.se.join(", ") + " / 경고·주의 " + o.warn; }

/* 약 이름 뒤 괄호에 적힌 성분명. 예: 넥실렌에스정[애엽이소프로판올연조엑스(20→1)], 훼로바-유서방정(건조황산제일철).
   진료과·복용 때·용량만 적힌 괄호는 성분으로 보지 않음 */
const NOT_ING = /(과|병원|의원|약국|센터|하루|매일|아침|점심|저녁|취침|자기|식전|식후|필요|회|번|일분|주분|알|정씩)$|^(정신|내과|외과|비뇨|피부|이비인후|안과|치과|신경)/;
function writtenIng(line){
  const s = str(line), out = [];
  const add = t => { t = t.replace(/\([^()]*\)/g, "").replace(/\s+/g, " ").trim(); if (/[가-힣a-z]{2,}/i.test(t) && !/^[\d\s.,~\-/→:]+/.test(t) && !NOT_ING.test(t) && !out.includes(t)) out.push(t); };
  (s.match(/\[([^\]]*)\]/g) || []).forEach(b => add(b.slice(1, -1)));
  if (!out.length) (s.match(/\(([^()]*)\)/g) || []).forEach(b => add(b.slice(1, -1)));
  return out.join(" + ");
}
/* AI 없이 약 이름만으로 내장 자료를 찾아 결과 틀을 만듦 */

/* 약별 정리에 쓸 내장 자료. AI가 읽은 성분으로 먼저 찾고, AI가 설명을 비워 둔 약은 입력한 이름으로 찾은 것을 씀 */
function offOf(x){
  const off = officialFor(x);
  if (off.length) return off;
  return !str(x.purpose) && !arr(x.side_effects).length ? localMatch(str(x.input)) : [];

/* ---------- 약으로 미루어 본 건강 상태 ----------

/* ---------- 혈압·체중: 잰 값이 어느 범위인지만 나눔(진단 아님). 약사·의사 검토를 받지 않은 기준 묶음 ----------
   혈압: 대한고혈압학회 고혈압 진료지침(2022)의 진료실 혈압 분류를 쉬운 말로 묶음.

const numOf = v => { const n = parseFloat(str(v).trim().replace(",", ".")); return isFinite(n) ? n : null; };
function bpLevel(s, d){
  s = numOf(s); d = numOf(d);
  if (s == null || d == null || s < 50 || s > 260 || d < 30 || d > 160 || d >= s) return null;
  if (s >= 180 || d >= 110) return {lv:"crit", label:"매우 높음", rank:4};
  if (s >= 140 || d >= 90) return {lv:"hi", label:"높음", rank:3};
  if (s >= 120 || d >= 80) return {lv:"mid", label:"조금 높음", rank:2};
  if (s < 90 || d < 60) return {lv:"mid", label:"낮음", rank:1};

}
const wtOk = w => { w = numOf(w); return w != null && w >= 20 && w <= 300 ? w : null; };

function bmiLevel(b){
  if (b == null) return null;
  if (b < 18.5) return {lv:"mid", label:"저체중"};
  if (b < 23) return {lv:"ok", label:"정상"};
  if (b < 25) return {lv:"mid", label:"비만 전단계"};

const bpText = x => x.sys + "/" + x.dia;
const signed = n => (n > 0 ? "+" : "") + n;
/* 측정 기록을 날짜순으로 고르고 요약: 마지막 혈압, 첫 기록보다 체중 변화, BMI, 살펴볼 점 */
function vitalsSum(list, cm){

    .map(x => { const lvl = bpLevel(x.sys, x.dia); return {date:str(x.date), sys:lvl ? numOf(x.sys) : null, dia:lvl ? numOf(x.dia) : null, lvl, wt:wtOk(x.wt)}; })

  else if (lastBp && lastBp.lvl.rank === 1) flags.push({lv:"mid", text:"혈압 낮음 " + bpText(lastBp)});
  if (change && change.pct >= 7) flags.push({lv:"hi", text:"체중 첫 기록보다 " + change.pct + "% 늘어남"});

/* AI 요청문에 넣을 측정 기록 (최근 max건) */

  s.list.slice(-(max || 20)).forEach(x => L.push("- " + x.date + ": " + [x.lvl ? "혈압 " + bpText(x) + " (" + x.lvl.label + ")" : "", x.wt ? "체중 " + x.wt + "kg" : ""].filter(Boolean).join(", ")));
  if (s.list.length > (max || 20)) L.push("(그 전 기록 " + (s.list.length - (max || 20)) + "건 생략)");
  if (s.bp.length) L.push("혈압 " + s.bp.length + "번 잼: 140/90 이상 " + s.highN + "번, 90/60 미만 " + s.lowN + "번");
  if (s.change) L.push("체중 변화: " + s.change.from.date + " " + s.change.from.wt + "kg → " + s.change.to.date + " " + s.change.to.wt + "kg (" + signed(s.change.kg) + "kg, " + signed(s.change.pct) + "%)");
  if (h) L.push("키 " + h + "cm" + (s.bmi ? ", 최근 BMI " + s.bmi + " (" + s.bmiLv.label + " 범위)" : ""));
  return L.join("\n");
}
/* 혈당(mg/dL): 대한당뇨병학회 당뇨병 진료지침(2023)의 기준값. 잰 때 when = fast 공복 · post 식후 2시간 · rand 식사와 무관 · "" 모름.
   공복 100 미만 정상·100~125 조금 높음(공복혈당장애)·126 이상 높음, 식후 2시간 140 미만 정상·140~199 조금 높음(내당능장애)·200 이상 높음,
   식사와 무관하거나 잰 때를 모르면 200 이상만 높음, 70 미만 낮음·54 미만 매우 낮음(저혈당 1·2단계). 잰 값의 범위일 뿐 진단 아님. 약사·의사 검토를 받지 않은 기준.
   측정 기록 한 건 = {date, bg, bgWhen} (클로드 약국이는 input.vitals, 현황판은 날짜별 기록 db.logs) */
const BG_WHEN = [["", "잰 때"], ["fast", "공복"], ["post", "식후 2시간"], ["rand", "식사와 무관"]];
const bgWhenLabel = w => { const x = w && BG_WHEN.find(p => p[0] === w); return x ? x[1] : ""; };
function bgLevel(v, when){
  v = numOf(v);
  if (v == null || v < 20 || v > 700) return null;
  if (v < 70) return v < 54 ? {lv:"crit", label:"매우 낮음", low:true, high:false} : {lv:"hi", label:"낮음", low:true, high:false};
  const cut = when === "fast" ? [100, 126] : when === "post" ? [140, 200] : null;
  if (!cut) return {lv:v >= 200 ? "hi" : "", label:v >= 200 ? "높음" : "", low:false, high:v >= 200};
  if (v >= cut[1]) return {lv:"hi", label:"높음", low:false, high:true};
  return v >= cut[0] ? {lv:"mid", label:"조금 높음", low:false, high:false} : {lv:"ok", label:"정상", low:false, high:false};
}
const bgShort = x => (bgWhenLabel(x.when) ? bgWhenLabel(x.when) + " " : "") + x.v;
/* 측정 기록에서 혈당만 날짜순으로: [{date, v, when, lvl}] */
function bgFrom(list){
  return arr(list).filter(x => x && /^\d{4}-\d{2}-\d{2}$/.test(str(x.date)) && str(x.bg).trim() && bgLevel(x.bg))
    .map(x => ({date:str(x.date), v:numOf(x.bg), when:str(x.bgWhen), lvl:bgLevel(x.bg, x.bgWhen)}))
    .sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
}
/* AI 요청문에 넣을 혈당 기록 (bgFrom 결과, 최근 max건) */
function bgText(list, max){
  if (!list.length) return "";
  const n = max || 20, L = ["[혈당 측정 기록 (mg/dL)] 범위 구분은 프로그램이 대한당뇨병학회 2023 기준(공복 100 미만 정상·100~125 조금 높음·126 이상 높음, 식후 2시간 140 미만 정상·140~199 조금 높음·200 이상 높음, "
    + "식사와 무관하게 잰 값은 200 이상만 높음, 70 미만 낮음)으로 나눈 것이다. 당뇨약을 먹는 회원은 주치의가 정한 목표 혈당이 따로 있을 수 있으니 범위만으로 단정하지 않는다."];
  list.slice(-n).forEach(x => L.push("- " + x.date + ": " + (bgWhenLabel(x.when) || "잰 때 모름") + " " + x.v + (x.lvl.label ? " (" + x.lvl.label + ")" : "")));
  if (list.length > n) L.push("(그 전 기록 " + (list.length - n) + "건 생략)");
  L.push("혈당 " + list.length + "번 잼: 높음 " + list.filter(x => x.lvl.high).length + "번, 70 미만 " + list.filter(x => x.lvl.low).length + "번");
  return L.join("\n");
}

function careTopics(drugs){
  const sex = lastInput ? lastInput.sex : "", out = [];
  if (!drugs.some(d => arr(d.ingredient_en).some(x => str(x).trim()))) return out;
  CARE.forEach(c => {
    const names = c.list ? drugs.filter(d => hit(d, c.list)).map(d => str(d.input)) : [];
    if (c.list && !names.length) return;
    if (c.id === "preg" && !lastConds.includes("preg") && (sex === "남성" || ["50대","60대","70대 이상"].includes(lastAge))) return;
    out.push({c, names, boost: arr(c.cond).some(id => lastConds.includes(id))});
  });
  return out.sort((a, b) => b.boost - a.boost);
}

const FORM_END = /(서방정|서방캡슐|장용정|장용캡슐|구강붕해정|필름코팅정|츄어블정|연질캡슐|경질캡슐|캡슐|캅셀|정|시럽|현탁액|패치)$/;
const DOSE_WORD = /^(반알|한알|두알|세알|반정|아침|점심|저녁|취침|자기|잠자기|하루|매일|식전|식후|필요시|필요할)/;
const DOSE_UNIT = /^\s*(mg|ml|mcg|μg|µg|g(?![a-z])|iu|밀리|미리|마이크로|그램)/i;
const squash = s => str(s).replace(/\s+/g, "").toLowerCase();
/* 줄에서 약 이름만 뗌: 앞의 번호, 괄호, 용량(숫자)부터 뒤, 복용 시간 낱말. B12, D3처럼 영문자에 바로 붙은 짧은 숫자는 이름으로 봄 */
function drugName(line){
  const s = str(line).replace(/^\s*(?:\d+\s*[.)]|[-•·*])\s*/, "").replace(/\([^)]*\)|\[[^\]]*\]/g, " ").replace(/[(\[].*$/, " ").replace(/\s+/g, " ").trim();
  let end = s.length;
  const re = /\d+(?:[.,]\d+)?/g;
  let m;
  while ((m = re.exec(s))){
    if (m.index === 0) continue;
    if (/[a-z]/i.test(s[m.index - 1]) && m[0].length <= 2 && !DOSE_UNIT.test(s.slice(m.index + m[0].length))) continue;
    end = m.index; break;
  }
  const words = [];
  for (const w of s.slice(0, end).trim().split(" ")){ if (words.length && DOSE_WORD.test(w)) break; if (w) words.push(w); }
  return words.join(" ");
}
function nameKey(line){
  const n = squash(drugName(line));
  return n ? "n:" + (n.replace(FORM_END, "") || n) : "";
}
const ingKey = ks => ks.length ? "i:" + Array.from(new Set(ks)).sort().join("+") : "";
/* AI가 읽은 영문 성분명. 내장 자료에 있는 성분은 내장 자료의 이름으로 맞춤 */
function aiKey(x){
  return ingKey(arr(x.ingredient_en).map(v => str(v).toLowerCase().replace(/\s+/g, " ").trim()).filter(Boolean)
    .map(i => { const o = OFFICIAL.find(o => o.k.some(t => (" " + i + " ").includes(" " + t + " "))); return o ? o.k[0] : i; }));
}
function mode(list){
  const c = new Map(); let best = "", n = 0;
  list.forEach(v => { const k = (c.get(v) || 0) + 1; c.set(v, k); if (k > n){ n = k; best = v; } });
  return best;
}

/* 혈압·체중은 날짜별 기록(db.logs)에 적은 그대로 둠(bpS·bpD·wt). 범위 판정은 함께 쓰는 vitalsSum */
const hasVitRaw = e => !!(e && (str(e.bpS).trim() || str(e.bpD).trim() || str(e.wt).trim()));
const vitOf = (date, e) => ({date, sys:e.bpS, dia:e.bpD, wt:e.wt});

const mdOf = iso => Number(str(iso).slice(5, 7)) + "월 " + Number(str(iso).slice(8, 10)) + "일";
/* 혈당(mg/dL): 날짜별 기록(db.logs)에 적은 그대로 둠(bg, 잰 때 bgWhen). 기준과 BG_WHEN·bgLevel·bgShort·bgText는 함께 쓰는 부분(index.html) */
const hasBgRaw = e => !!(e && str(e.bg).trim());
const bgItem = (date, e) => ({date, v:numOf(e.bg), when:str(e.bgWhen), lvl:bgLevel(e.bg, e.bgWhen)});
const bgList = pairs => pairs.filter(([, e]) => e && hasBgRaw(e) && bgLevel(e.bg)).map(([k, e]) => bgItem(k, e));
const bgOf = m => bgList(Object.keys(db.logs[m.id] || {}).sort().map(k => [k, db.logs[m.id][k]]));

/* 약 점검: 내장 자료와 내장 규칙만 씀 (AI 아님). 같은 입력이면 다시 계산하지 않음 */
const anaCache = new Map();
function analyze(m){
  const key = [m.drugs, arr(m.conds).join(","), m.age, m.sex].join("\u0001"), c = anaCache.get(m.id);
  if (c && c.key === key) return c.val;
  const drugs = localData(linesOf(m)).drugs;
  lastConds = arr(m.conds); lastAge = str(m.age); lastInput = {sex:str(m.sex)};
  const lc = localCheck(drugs), cc = condCheck(drugs), care = careTopics(drugs);
  const val = {drugs, lc, cc, care,
    hi: lc.pairs.filter(p => p.lv === "높음").length + cc.filter(x => x.lv === "높음").length,
    mid: lc.pairs.filter(p => p.lv === "보통").length + cc.filter(x => x.lv === "보통").length,
    known: drugs.filter(x => offOf(x).length).length};
  anaCache.set(m.id, {key, val});
  return val;
}

/* 공통으로 먹는 약: 성분이 같거나(내장 사전) 용량을 뺀 약 이름이 같으면 같은 약 */
function boardCommon(){
  const occ = [];
  db.members.forEach(m => linesOf(m).forEach(line => {
    const lm = localMatch(line), o = {id:m.id, line, name:drugName(line), nk:nameKey(line), dict:ingKey(lm.map(v => v.k[0]))};
    if (o.nk || o.dict) occ.push(o);
  }));
  const byName = new Map();
  occ.forEach(o => { const k = o.nk || o.dict; if (!byName.has(k)) byName.set(k, []); byName.get(k).push(o); });
  const groups = new Map();
  byName.forEach((list, k) => {
    const g = mode(list.map(o => o.dict).filter(Boolean)) || k;
    if (!groups.has(g)) groups.set(g, []);
    groups.get(g).push(...list);
  });
  const rows = [], byLine = new Map();
  groups.forEach((list, key) => {
    const ids = [];
    list.forEach(o => { if (!ids.includes(o.id)) ids.push(o.id); });
    if (ids.length < 2) return;
    ids.sort((a, b) => orderOf(a) - orderOf(b));
    const ks = key.startsWith("i:") ? key.slice(2).split("+") : [], os = ks.map(k => OFFICIAL.find(o => o.k[0] === k));
    const official = ks.length && os.every(Boolean);
    const title = official ? os.map(o => o.ko[0]).join(" + ") : mode(list.map(o => o.name)) || list[0].line;
    const names = Array.from(new Set(list.map(o => o.name).filter(Boolean))).filter(n => n !== title);
    rows.push({key, ids, title, cls: official ? os.map(o => o.cls).join(" / ") : "", names});
    list.forEach(o => byLine.set(o.id + "\u0001" + o.line, ids));
  });
  rows.sort((a, b) => b.ids.length - a.ids.length || a.title.localeCompare(b.title, "ko"));
  return {rows, byLine};

    el("p", {class:"p-meta", style:"margin-top:8pt", text:"요약: " + (sum.join(" · ") || "없음")}),
    ov ? el("h2", {text:"AI 종합 정리 (" + aiDate(ov.at) + (ov.drugs !== m.drugs ? ", 약이 바뀌기 전" : "") + ", 참고자료, 진단 아님)"}) : null,
    ov ? el("p", {class:"p-ai", text:ov.text}) : null)], "약국이_측정기록_" + fileSafe(m.label) + "_" + today(), btn);
}
function printGuide(m, btn){
  saveNow();
  const pages = [el("div", {class:"p-page p-guide"},
    el("h1", {text:str(m.label) + "의 약 안내"}),
    ...linesOf(m).map(line => { const g = guideOf(m, line); return el("div", {class:"p-drug"}, el("h2", {text:drugName(line) || line}),
      g.when ? el("p", null, el("b", {text:"언제 먹나요"}), g.when) : null,
      g.use ? el("p", null, el("b", {text:"무엇을 돕나요"}), g.use) : null,
      g.tell ? el("p", null, el("b", {text:"이럴 땐 말해 주세요"})) : null,
      ...g.tell.split("/").map(x => x.trim()).filter(Boolean).map(x => el("p", {text:"· " + x}))); }),
    el("p", {class:"p-foot", text:"몸이 이상하거나 궁금한 것이 있으면 언제든 선생님께 말해 주세요. 약은 마음대로 끊거나 늘리지 말아요."}))];
  if (guideWeek){
    const slots = ["아침", "점심", "저녁", "자기 전"];
    pages.push(el("div", {class:"p-page p-week"}, el("h1", {text:str(m.label) + "의 일주일 약 체크표"}),
      el("p", {class:"p-meta", style:"font-size:14pt", text:"약을 먹으면 칸에 ○ 표시를 해요."}),
      el("table", null, el("thead", null, el("tr", null, el("th", {text:""}), ...slots.map(s => el("th", {text:s})))),
        el("tbody", null, ...["월","화","수","목","금","토","일"].map(d => el("tr", null, el("th", {text:d + "요일"}), ...slots.map(() => el("td"))))))));
  }
  doPrint(pages, "약국이_안내문_" + fileSafe(m.label) + "_" + today(), btn);
}

/* ---------- 가져오기·백업 ---------- */
function oldList(){
  try { const v = JSON.parse(localStorage.getItem(OLD) || "null"); return v && Array.isArray(v.list) ? v.list.filter(m => m && typeof m.id === "string") : []; }
  catch (e) { return []; }
}
/* 약국이 기록을 현황판으로 옮김. 새 회원은 더하고, 이미 가져온 회원은 약국이 쪽이 더 새로 바뀌었으면 약·정보를 맞춤.
   현황판에서도 약을 고친 회원은 덮어쓰지 않고 알려 줌. fromUpdated = 마지막으로 맞춘 약국이 기록 시각, importedDrugs = 그때 가져온 약 */
function syncPlan(list){
  const plan = {add:[], upd:[], kept:[], infoKept:[]};
  arr(list).forEach(o => {
    if (!o || typeof o.id !== "string") return;
    const m = db.members.find(x => x.from === o.id || x.id === o.id);
    if (!m){ plan.add.push(o); return; }
    if (!m.from || str(o.updated) <= str(m.fromUpdated)) return;
    const drugs = str((o.input || {}).drugs);
    if (drugs === str(m.drugs) || (m.importedDrugs != null && str(m.drugs) === str(m.importedDrugs))) plan.upd.push([m, o, drugs !== str(m.drugs)]);
    else plan.kept.push([m, o]);
  });
  return plan;
}
function takeVitals(m, i){
  const L = db.logs[m.id] = db.logs[m.id] || {}, at = new Date().toISOString();
  let n = 0;
  arr(i.vitals).forEach(v => {
    if (!v || !/^\d{4}-\d{2}-\d{2}$/.test(str(v.date))) return;
    const p = {}, day = L[v.date];
    if (!hasVitRaw(day)){   /* 현황판에 이미 잰 값이 있는 날은 그대로 둠 */
      if (bpLevel(v.sys, v.dia)){ p.bpS = String(numOf(v.sys)); p.bpD = String(numOf(v.dia)); }
      if (wtOk(v.wt)) p.wt = String(wtOk(v.wt));
    }
    if (!hasBgRaw(day) && str(v.bg).trim() && bgLevel(v.bg)){ p.bg = String(numOf(v.bg)); p.bgWhen = BG_WHEN.some(x => x[0] && x[0] === str(v.bgWhen)) ? str(v.bgWhen) : ""; }
    if (!Object.keys(p).length) return;
    L[v.date] = Object.assign({med:"", signs:[], note:""}, L[v.date] || {}, p, {at});
    n++;
  });
  if (!Object.keys(L).length) delete db.logs[m.id];
  return n;
}
/* 나이·성별·회원 상태: 약국이에서 가져온 값(importedInfo)을 현황판에서 고치지 않았을 때만 새 값으로 바꿈.
   예전에 가져와 importedInfo가 없는 회원은 비어 있는 칸만 채우고, 회원 상태는 지우지 않고 더하기만 함. 현황판 값을 남겼으면 true */
const infoOf = i => ({age:str(i.age), sex:str(i.sex), conds:arr(i.conds).map(str)});
const sameConds = (a, b) => arr(a).slice().sort().join(",") === arr(b).slice().sort().join(",");
function mergeInfo(m, i){
  const was = m.importedInfo, now = infoOf(i);
  let kept = false;
  ["age", "sex"].forEach(f => {
    const cur = str(m[f]);
    if (!cur || (was && cur === str(was[f]))) m[f] = now[f];
    else if (cur !== now[f]) kept = true;
  });
  const cur = arr(m.conds).map(str);
  if (was && sameConds(cur, was.conds)) m.conds = now.conds;
  else { const u = Array.from(new Set(cur.concat(now.conds))); if (!sameConds(u, now.conds)) kept = true; m.conds = u; }
  m.importedInfo = now;
  return kept;
}
function applyPlan(plan){
  const now = new Date().toISOString();
  let vit = 0;
  plan.add.forEach(o => {
    const i = o.input || {}, m = {id:newId(), from:o.id, fromUpdated:str(o.updated), importedDrugs:str(i.drugs), label:str(o.label).slice(0, 20) || nextLabel(),
      age:str(i.age), sex:str(i.sex), height:str(i.height).trim(), conds:arr(i.conds).map(str), drugs:str(i.drugs), guide:{}, created:now, updated:now, importedInfo:infoOf(i)};
    db.members.push(m);
    vit += takeVitals(m, i);
  });
  plan.upd.forEach(([m, o]) => {
    const i = o.input || {};
    if (mergeInfo(m, i)) plan.infoKept.push([m, o]);
    Object.assign(m, {drugs:str(i.drugs), importedDrugs:str(i.drugs), height:str(i.height).trim() || str(m.height), fromUpdated:str(o.updated)});
    vit += takeVitals(m, i);
    touch(m);
  });
  plan.kept.forEach(([m, o]) => {
    const i = o.input || {};
    vit += takeVitals(m, i);
    if (!str(m.height).trim() && str(i.height).trim()){ m.height = str(i.height).trim(); touch(m); }
  });
  plan.vit = vit;
  saveNow();
}
function planText(plan, where){
  const names = list => list.map(([m]) => str(m.label)).join(", "), parts = [];
  if (plan.add.length) parts.push("새 회원 " + plan.add.length + "명을 가져왔습니다");
  const chg = plan.upd.filter(x => x[2]), info = plan.upd.filter(x => !x[2]);
  if (chg.length) parts.push("약이 바뀐 회원 " + chg.length + "명(" + names(chg) + ")의 약을 새로 맞췄습니다");
  if (info.length) parts.push("기록이 바뀐 회원 " + info.length + "명(" + names(info) + ")의 정보를 맞췄습니다");
  if (plan.vit) parts.push("혈압·체중·혈당 " + plan.vit + "건을 측정 기록에 넣었습니다");
  let t = where + (parts.length ? "에서 " + parts.join(", ") + "." : "에서 새로 가져오거나 바꿀 회원이 없습니다.");
  if (plan.infoKept && plan.infoKept.length) t += " 새 약국이에서 고친 나이·성별·회원 상태(" + names(plan.infoKept) + ")는 그대로 두었습니다.";
  if (plan.kept.length) t += " 새 약국이에서도 약을 고친 회원(" + names(plan.kept) + ")은 그대로 두었습니다. 두 쪽의 약을 비교해 맞춰 주세요.";
  return t;
}
const oldPlan = () => syncPlan(oldList());
function refreshImport(){
  const pl = oldPlan(), n = pl.add.length + pl.upd.length;
  $("importOld").hidden = !n;
  $("importOld").textContent = "기존 약국이 회원 가져오기 (" + [pl.add.length ? "새 " + pl.add.length + "명" : "", pl.upd.length ? "바뀜 " + pl.upd.length + "명" : ""].filter(Boolean).join(" · ") + ")";
}
function dataMsg(t, err){ const m = $("dataMsg"); m.textContent = t; m.className = "status" + (err ? " err" : ""); }
function importOld(){
  const pl = oldPlan(); applyPlan(pl);
  dataMsg(planText(pl, "기존 약국이"));
  $("dataMenu").open = true; paint();
}
$("importOld").addEventListener("click", importOld);
$("addMember").addEventListener("click", () => { const m = addMember(); focusDrugs = true; go("#m-" + m.id); });
$("backupSave").addEventListener("click", () => {
  saveNow();
  const name = "약국이현황판_백업_" + today() + ".json";
  const text = JSON.stringify({app:"약국이 현황판", v:1, saved:new Date().toISOString(), members:db.members, logs:db.logs}, null, 1);
  saveFile(name, text, "application/json")
    .then(() => dataMsg("회원 " + db.members.length + "명의 기록을 백업 파일로 내려받았습니다."))
    .catch(e => dataMsg(e && e.code === "declined" ? "내려받기를 취소했습니다." : "백업 파일을 내려받지 못했습니다.", true));
});
$("backupLoad").addEventListener("change", e => {
  const f = e.target.files && e.target.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const v = JSON.parse(String(r.result).replace(/^﻿/, ""));
      if (v && v.app === "약국이 현황판" && Array.isArray(v.members)){
        let add = 0, upd = 0, days = 0;
        v.members.filter(m => m && typeof m.id === "string" && typeof m.label === "string").forEach(m => {
          const i = db.members.findIndex(x => x.id === m.id);
          if (i < 0){ db.members.push(m); add++; } else if (str(m.updated) > str(db.members[i].updated)){ db.members[i] = m; upd++; }
        });
        Object.keys(v.logs && typeof v.logs === "object" ? v.logs : {}).forEach(mid => {
          const src = v.logs[mid] || {}, L = db.logs[mid] = db.logs[mid] || {};
          Object.keys(src).forEach(d => { const x = src[d]; if (/^\d{4}-\d{2}-\d{2}$/.test(d) && x && typeof x === "object" && (!L[d] || str(x.at) > str(L[d].at))){ L[d] = x; days++; } });
        });
        anaCache.clear(); saveNow();
        dataMsg("불러왔습니다. 새 회원 " + add + "명, 더 새 기록으로 바뀐 회원 " + upd + "명, 날짜별 기록 " + days + "일.");
      } else if (v && Array.isArray(v.list)){
        const pl = syncPlan(v.list); applyPlan(pl);
        dataMsg(planText(pl, "약국이 백업 파일"));
      } else throw new Error("shape");
      paint();
    } catch (x) { dataMsg("백업 파일을 읽지 못했습니다. 약국이나 약국이 현황판에서 내려받은 .json 파일인지 확인해 주세요.", true); }
    e.target.value = "";
  };
  r.onerror = () => { dataMsg("파일을 읽지 못했습니다.", true); e.target.value = ""; };
  r.readAsText(f);
});
/* 같은 브라우저의 다른 창에서 바뀐 기록을 따라감 (글을 쓰는 중이면 그리지 않음) */
window.addEventListener("storage", e => {
  if (e.key !== KEY && e.key !== OLD) return;
  if (e.key === KEY){ db = loadDb(); anaCache.clear(); }
  const a = document.activeElement;
  if (a && (a.tagName === "TEXTAREA" || (a.tagName === "INPUT" && a.type !== "checkbox"))) return;
  paint();
});
document.addEventListener("click", e => { const m = $("dataMenu"); if (m.open && !m.contains(e.target)) m.open = false; });
$("modeTag").hidden = !IN_CLAUDE;
route = readHash();
paint();
