<!DOCTYPE html>
<!--@@LICENSE@@-->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>약국이 현황판</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@600&display=swap" rel="stylesheet">
<style>
/* 약국이 현황판: 회원을 한눈에 보는 현황판 + 회원 한 화면(약 정리, 혈압·체중·혈당, AI 종합 정리, 쉬운 안내문). 기록은 이 브라우저에만 저장. */
:root{
  --bg:#f2f5f4; --surface:#ffffff; --ink:#1c2b2a; --muted:#5a6967; --line:#d3dbd9;
  --accent:#0e6b62; --accent-ink:#ffffff; --note-bg:#e6f0ee;
  --ok:#1d7347; --ok-bg:#e2f2e8; --warn:#8a5200; --warn-bg:#fdf2dc; --crit:#a02020; --crit-bg:#fbe8e6;
  --common:#5b3fa6; --common-bg:#efeafa;
  --display:"Noto Serif KR","Apple SD Gothic Neo",serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#111817; --surface:#1a2322; --ink:#e5edeb; --muted:#9aaba8; --line:#2f3c3a;
    --accent:#5cc4b6; --accent-ink:#0b1a18; --note-bg:#1e2d2b;
    --ok:#6fd3a0; --ok-bg:#173527; --warn:#f0b860; --warn-bg:#392d13; --crit:#ff9d94; --crit-bg:#3c1d1a;
    --common:#c4b2ff; --common-bg:#2c2545;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#111817; --surface:#1a2322; --ink:#e5edeb; --muted:#9aaba8; --line:#2f3c3a;
  --accent:#5cc4b6; --accent-ink:#0b1a18; --note-bg:#1e2d2b;
  --ok:#6fd3a0; --ok-bg:#173527; --warn:#f0b860; --warn-bg:#392d13; --crit:#ff9d94; --crit-bg:#3c1d1a;
  --common:#c4b2ff; --common-bg:#2c2545;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55}
.wrap{max-width:1240px;margin:0 auto;padding:20px 16px 48px;display:flex;flex-direction:column;gap:16px}
h1{font-family:var(--display);font-size:24px;margin:0}
h2{font-size:16px;margin:0;font-weight:600}
h3{font-size:14px;margin:0;font-weight:600;color:var(--muted)}
p{margin:0}
a{color:var(--accent)}
ul,ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
button{font:inherit;font-weight:500;border-radius:7px;padding:8px 14px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.mini{padding:3px 10px;font-size:13px}
button:disabled{opacity:.45;cursor:not-allowed}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:7px 10px;width:100%}
textarea{resize:vertical}
input[type=checkbox]{width:auto}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.status{font-size:13.5px;color:var(--muted);min-height:1.2em}
.status.err{color:var(--crit)}
.muted{color:var(--muted);font-size:13.5px}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:1px 8px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.tag.hi{color:var(--crit);background:var(--crit-bg)}
.tag.mid{color:var(--warn);background:var(--warn-bg)}
.tag.ok{color:var(--ok);background:var(--ok-bg)}
.tag.low{color:var(--muted)}
.tag.off{color:var(--accent);background:var(--note-bg)}
.tag.common{color:var(--common);background:var(--common-bg)}
.tags{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.wrapcol{display:flex;flex-direction:column;gap:16px;min-width:0}
#view{display:flex;flex-direction:column;gap:16px;min-width:0}
#view > :empty{display:none}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

/* 머리 */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand h1 span{font-family:var(--body);font-size:15px;font-weight:600;color:var(--accent);margin-left:4px}
.today{color:var(--muted);font-size:14px}
.top-actions{display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap}
details.menu{position:relative}
details.menu > summary{list-style:none;cursor:pointer;border:1px solid var(--line);border-radius:7px;padding:8px 14px;background:var(--surface);font-weight:500}
details.menu > summary::-webkit-details-marker{display:none}
.menu-body{position:absolute;right:0;top:calc(100% + 6px);z-index:5;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px;width:min(300px,calc(100vw - 32px));box-shadow:0 8px 24px rgba(0,0,0,.12)}
.menu-body button,.file-btn{text-align:left}
.file-btn{display:block;border:1px solid var(--line);border-radius:7px;padding:8px 14px;cursor:pointer;font-weight:500}
.file-btn input{position:absolute;width:1px;height:1px;opacity:0}
.file-btn:focus-within{outline:2px solid var(--accent);outline-offset:2px}

/* 현황판 */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.tile b{font-size:28px;font-weight:600;line-height:1.2}
.tile b small{font-size:15px;font-weight:500;color:var(--muted);margin-left:2px}
.tile span{color:var(--muted);font-size:13.5px}
.tile.warn b{color:var(--warn)} .tile.common b{color:var(--common)}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
.side{display:flex;flex-direction:column;gap:16px;min-width:0}
@media (max-width:960px){.grid{grid-template-columns:1fr}}
@media (max-width:640px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.find{max-width:220px}
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:minmax(120px,1fr) minmax(200px,1.5fr) minmax(140px,1.4fr);gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.row.head{border-top:0;padding-top:0;color:var(--muted);font-size:12.5px;font-weight:600}
.who{display:flex;flex-direction:column;gap:2px;min-width:0}
.who button{border:0;background:none;padding:0;text-align:left;font-weight:600;font-size:15.5px;color:var(--accent);text-decoration:underline;text-underline-offset:3px;overflow-wrap:anywhere}
.meas{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
@media (max-width:820px){
  .row{grid-template-columns:1fr;gap:6px}
  .row.head{display:none}
}
.alert-item{display:flex;flex-direction:column;gap:4px;padding:8px 0;border-top:1px solid var(--line)}
.alert-item:first-of-type{border-top:0}
.citem{display:flex;flex-direction:column;gap:5px;padding:8px 0 8px 10px;border-left:3px solid var(--common)}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{padding:2px 9px;font-size:13px;border-radius:999px}
.empty{align-items:flex-start}
.empty .btns{display:flex;gap:8px;flex-wrap:wrap}

/* 회원 화면 */
.crumb a{font-weight:500}
.mhead{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.mhead input.mlabel{font-size:20px;font-weight:600;width:auto;max-width:260px;padding:4px 8px}
details.minfo summary{cursor:pointer;font-weight:500;font-size:14px;color:var(--accent)}
.minfo-body{display:flex;flex-direction:column;gap:10px;padding-top:10px}
.pair{display:flex;gap:10px;flex-wrap:wrap}
.pair label{display:flex;flex-direction:column;gap:4px;font-size:13.5px;font-weight:500;flex:1 1 140px}
.conds{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:4px 10px}
.conds label{display:flex;gap:6px;align-items:flex-start;font-size:13.5px}
.conds input{margin-top:4px}
.sum{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.drugs{display:flex;flex-direction:column;gap:12px}
.drug{display:flex;flex-direction:column;gap:6px;padding-top:12px;border-top:1px solid var(--line)}
.drug:first-child{border-top:0;padding-top:0}
.drug.common{border-left:3px solid var(--common);padding-left:12px}
.drug-head{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
dl.kv{display:grid;grid-template-columns:6.4em minmax(0,1fr);gap:4px 12px;margin:0}
.kv dt{font-size:13px;color:var(--muted);padding-top:1px}
.kv dd{margin:0;font-size:14.5px;overflow-wrap:anywhere;display:flex;flex-direction:column;gap:2px}
.combo{border-left:4px solid var(--line);padding:4px 0 4px 12px;display:flex;flex-direction:column;gap:3px}
.combo.hi{border-color:var(--crit)} .combo.mid{border-color:var(--warn)}
.combo-top{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-weight:500}
details.care{border:1px solid var(--line);border-radius:8px;padding:9px 12px}
details.care summary{cursor:pointer;font-weight:600}
details.care summary > * + *{margin-left:8px}
.care-body{display:flex;flex-direction:column;gap:6px;padding-top:8px;font-size:14.5px}

/* 혈압·체중·혈당 */
.vform{display:flex;gap:8px 14px;flex-wrap:wrap;align-items:center}
.vform input{width:86px}
.vform input[type=date]{width:auto}
.vform select{width:auto}
.vlist{display:flex;flex-direction:column}
.vitem{display:flex;gap:6px 12px;align-items:center;flex-wrap:wrap;padding:7px 0;border-top:1px solid var(--line);font-size:14.5px}
.vitem:first-child{border-top:0}
.vitem .vdate{font-weight:600;min-width:7.5em}
.vitem button{margin-left:auto}

/* 안내문 */
.gitem{display:flex;flex-direction:column;gap:6px;padding-top:12px;border-top:1px solid var(--line)}
.gitem:first-of-type{border-top:0;padding-top:0}
.gitem label{font-size:13px;color:var(--muted);font-weight:500}
.gitem h3{font-size:16px;color:var(--ink)}
.ai-text{white-space:pre-wrap;background:var(--note-bg);border-radius:8px;padding:10px 12px;font-size:14.5px;line-height:1.65}
.ask-paste{display:flex;flex-direction:column;gap:8px;border:1px dashed var(--line);border-radius:8px;padding:10px}
.ask-paste textarea{min-height:80px;font-size:13.5px}
.vrow{display:flex;gap:8px 14px;flex-wrap:wrap;align-items:center}
.vrow input{width:86px}
.vrow select{width:auto}
.vbp,.vwt{display:flex;gap:5px;align-items:center}

/* 인쇄 */
#print{display:none}
@media print{
  body{background:#fff;color:#000}
  body > .wrap{display:none}
  #print{display:block;font-family:var(--body);color:#000}
  @page{size:A4;margin:14mm}
  .p-page{page-break-after:always}
  .p-page:last-child{page-break-after:auto}
  .p-page h1{font-family:var(--body);font-size:20pt;margin:0 0 4pt}
  .p-meta{font-size:10pt;margin-bottom:8pt}
  .p-log table{width:100%;border-collapse:collapse;font-size:9.5pt}
  .p-log th,.p-log td{border:1px solid #888;padding:3pt 5pt;text-align:left;vertical-align:top}
  .p-log td:first-child{white-space:nowrap}
  .p-log h2{font-size:12pt;margin:10pt 0 4pt}
  .p-ai{font-size:10pt;white-space:pre-wrap;line-height:1.5}
  .p-guide h1{font-size:26pt}
  .p-drug{border:2px solid #000;border-radius:8pt;padding:8pt 12pt;margin:0 0 10pt;break-inside:avoid}
  .p-drug h2{font-size:21pt;margin:0 0 4pt}
  .p-drug p{font-size:15pt;margin:2pt 0;line-height:1.45}
  .p-drug b{display:inline-block;min-width:6.5em}
  .p-foot{font-size:15pt;font-weight:600;margin-top:10pt;line-height:1.5}
  .p-week table{width:100%;border-collapse:collapse;font-size:15pt}
  .p-week th,.p-week td{border:2px solid #000;height:16mm;text-align:center}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><h1>약국이 <span>현황판</span></h1><span class="today" id="today"></span></div>
    <div class="top-actions">
      <button type="button" class="primary" id="addMember">+ 회원 추가</button>
      <details class="menu" id="dataMenu">
        <summary>기록 관리</summary>
        <div class="menu-body">
          <button type="button" id="importOld" hidden>기존 약국이 회원 가져오기</button>
          <button type="button" id="backupSave">백업 파일 내려받기</button>
          <label class="file-btn">백업 파일 불러오기<input type="file" id="backupLoad" accept=".json,application/json"></label>
          <p class="status" id="dataMsg" role="status"></p>
        </div>
      </details>
    </div>
  </header>
  <p class="status" id="saveMsg" role="status" hidden></p>
  <main id="view"></main>
</div>
<div id="print"></div>
<script>
const $ = id => document.getElementById(id);
function el(tag, attrs, ...kids){
  const n = document.createElement(tag);
  for (const k in (attrs || {})){
    const v = attrs[k];
    if (v == null || v === false) continue;
    if (k === "class") n.className = v;
    else if (k === "text") n.textContent = v;
    else if (k === "on") for (const ev in v) n.addEventListener(ev, v[ev]);
    else n.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat()){ if (c == null || c === false) continue; n.append(c.nodeType ? c : document.createTextNode(String(c))); }
  return n;
}
const arr = v => Array.isArray(v) ? v : [];
const str = v => (v == null ? "" : String(v));
let lastInput = null;   /* 함께 쓰는 careTopics가 성별을 여기서 읽음 */

/*@@SHARED@@*/

/* ---------- 저장: 이 브라우저에만 둠 (기존 약국이와 섞이지 않게 따로) ---------- */
const KEY = "yakkuk.board.v1", OLD = "yakkuk.members.v1";
const blankDb = () => ({v:1, members:[], logs:{}});
let storeOk = true, saveTimer = null;
function loadDb(){
  let raw = null;
  try { raw = localStorage.getItem(KEY); } catch (e) { storeOk = false; return blankDb(); }
  if (!raw) return blankDb();
  try {
    const v = JSON.parse(raw);
    if (v && Array.isArray(v.members)) return {v:1, members:v.members.filter(m => m && typeof m.id === "string"), logs:v.logs && typeof v.logs === "object" ? v.logs : {}};
  } catch (e) {}
  try { localStorage.setItem(KEY + ".broken", raw); } catch (e) {}   /* 읽지 못한 자료는 덮어쓰기 전에 따로 보관 */
  return blankDb();
}
let db = loadDb();
function saveNow(){
  clearTimeout(saveTimer);
  try { localStorage.setItem(KEY, JSON.stringify(db)); storeOk = true; }
  catch (e) { storeOk = false; }
  const m = $("saveMsg");
  m.hidden = storeOk;
  m.className = "status err";
  m.textContent = storeOk ? "" : "이 브라우저에 저장하지 못했습니다. 저장 공간이 가득 찼거나 저장이 막혀 있습니다. 백업 파일을 내려받아 두세요.";
}
function saveSoon(){ clearTimeout(saveTimer); saveTimer = setTimeout(saveNow, 300); }
window.addEventListener("pagehide", saveNow);
document.addEventListener("visibilitychange", () => { if (document.hidden) saveNow(); });

/* ---------- 날짜 ---------- */
const pad = n => String(n).padStart(2, "0");
const isoOf = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const dayOf = s => { const p = str(s).split("-").map(Number); return new Date(p[0], p[1] - 1, p[2]); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const WD = ["일","월","화","수","목","금","토"];
const today = () => isoOf(new Date());
const korDate = s => { const d = dayOf(s); return (d.getMonth() + 1) + "월 " + d.getDate() + "일 (" + WD[d.getDay()] + ")"; };
function lastDays(n){ const t = dayOf(today()), out = []; for (let i = n - 1; i >= 0; i--) out.push(isoOf(addDays(t, -i))); return out; }

/* ---------- 회원과 날짜별 기록 ----------
   2026-11-21 사용자 결정으로 날짜별 일지(복약·관찰된 변화·메모·달력)를 화면에서 뺌. 예전에 적은 med·signs·note는 지우지 않고
   db.logs에 그대로 두며 백업에도 들어감. 지금은 그날 기록에 혈압·체중·혈당만 적음 */
const memberById = id => db.members.find(m => m.id === id) || null;
const linesOf = m => str(m.drugs).split("\n").map(v => v.trim()).filter(Boolean);
const orderOf = id => { const i = db.members.findIndex(m => m.id === id); return i < 0 ? db.members.length : i; };
const newId = () => "b" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const touch = m => { m.updated = new Date().toISOString(); };
function nextLabel(){
  const n = db.members.reduce((mx, m) => { const k = /^회원 (\d+)$/.exec(str(m.label)); return k ? Math.max(mx, +k[1]) : mx; }, 0) + 1;
  return "회원 " + n;
}
function addMember(){
  const now = new Date().toISOString();
  const m = {id:newId(), label:nextLabel(), age:"", sex:"", conds:[], drugs:"", guide:{}, created:now, updated:now};
  db.members.push(m); saveNow();
  return m;
}
const logOf = (mid, date) => (db.logs[mid] || {})[date] || null;
function setLog(mid, date, patch){
  const L = db.logs[mid] = db.logs[mid] || {};
  const e = Object.assign({med:"", signs:[], note:""}, L[date] || {}, patch, {at:new Date().toISOString()});
  if (!e.med && !arr(e.signs).length && !str(e.note).trim() && !hasVitRaw(e) && !hasBgRaw(e)) delete L[date]; else L[date] = e;
}
/* 혈압·체중은 날짜별 기록(db.logs)에 적은 그대로 둠(bpS·bpD·wt). 범위 판정은 함께 쓰는 vitalsSum */
const hasVitRaw = e => !!(e && (str(e.bpS).trim() || str(e.bpD).trim() || str(e.wt).trim()));
const vitOf = (date, e) => ({date, sys:e.bpS, dia:e.bpD, wt:e.wt});
const vitalsOf = m => Object.keys(db.logs[m.id] || {}).filter(d => db.logs[m.id][d]).map(d => vitOf(d, db.logs[m.id][d]));
const mdOf = iso => Number(str(iso).slice(5, 7)) + "월 " + Number(str(iso).slice(8, 10)) + "일";
/* 혈당(mg/dL): 날짜별 기록(db.logs)에 적은 그대로 둠(bg). 잰 때 bgWhen = fast 공복 · post 식후 2시간 · rand 식사와 무관 · "" 모름.
   범위는 대한당뇨병학회 당뇨병 진료지침(2023)의 기준값: 공복 100 미만 정상·100~125 조금 높음(공복혈당장애)·126 이상 높음,
   식후 2시간 140 미만 정상·140~199 조금 높음(내당능장애)·200 이상 높음, 식사와 무관하거나 잰 때를 모르면 200 이상만 높음,
   70 미만 낮음·54 미만 매우 낮음(저혈당 1·2단계). 잰 값의 범위일 뿐 진단 아님. 약사·의사 검토를 받지 않은 기준 */
const BG_WHEN = [["", "잰 때"], ["fast", "공복"], ["post", "식후 2시간"], ["rand", "식사와 무관"]];
const bgWhenLabel = w => { const x = w && BG_WHEN.find(p => p[0] === w); return x ? x[1] : ""; };
const hasBgRaw = e => !!(e && str(e.bg).trim());
function bgLevel(v, when){
  v = numOf(v);
  if (v == null || v < 20 || v > 700) return null;

function boardCommon(){
  const occ = [];
  db.members.forEach(m => linesOf(m).forEach(line => {
    const lm = localMatch(line), o = {id:m.id, line, name:drugName(line), nk:nameKey(line), dict:ingKey(lm.map(v => v.k[0]))};
    if (o.nk || o.dict) occ.push(o);
  }));
  const byName = new Map();
  occ.forEach(o => { const k = o.nk || o.dict; if (!byName.has(k)) byName.set(k, []); byName.get(k).push(o); });
  const groups = new Map();
  byName.forEach((list, k) => {
    const g = mode(list.map(o => o.dict).filter(Boolean)) || k;
    if (!groups.has(g)) groups.set(g, []);
    groups.get(g).push(...list);
  });
  const rows = [], byLine = new Map();
  groups.forEach((list, key) => {
    const ids = [];
    list.forEach(o => { if (!ids.includes(o.id)) ids.push(o.id); });
    if (ids.length < 2) return;
    ids.sort((a, b) => orderOf(a) - orderOf(b));

    const official = ks.length && os.every(Boolean);

    const names = Array.from(new Set(list.map(o => o.name).filter(Boolean))).filter(n => n !== title);
    rows.push({key, ids, title, cls: official ? os.map(o => o.cls).join(" / ") : "", names});

/* 답 속의 JSON 목록 찾기: ```json 칸을 먼저 보고, 앞뒤 설명글 속 대괄호는 건너뜀 */
function jsonList(t){
  const fence = t.match(/```(?:json)?\s*([\s\S]*?)```/), srcs = fence ? [fence[1], t] : [t];
  for (const s of srcs){
    const end = s.lastIndexOf("]");
    for (let i = s.indexOf("["); i >= 0 && i < end; i = s.indexOf("[", i + 1)){
      try { const v = JSON.parse(s.slice(i, end + 1)); if (Array.isArray(v) && v.some(x => x && typeof x === "object")) return v; } catch (e) {}
    }
  }
  return null;
}

    db.members.push(m);
    vit += takeVitals(m, i);
  });
  plan.upd.forEach(([m, o]) => {
    const i = o.input || {};
    Object.assign(m, {drugs:str(i.drugs), importedDrugs:str(i.drugs), age:str(i.age), sex:str(i.sex), height:str(i.height).trim() || str(m.height), conds:arr(i.conds).map(str), fromUpdated:str(o.updated)});
    vit += takeVitals(m, i);
    touch(m);
  });
  plan.kept.forEach(([m, o]) => {
    const i = o.input || {};
    vit += takeVitals(m, i);
    if (!str(m.height).trim() && str(i.height).trim()){ m.height = str(i.height).trim(); touch(m); }
  });
  plan.vit = vit;
  saveNow();
}
function planText(plan, where){
  const names = list => list.map(([m]) => str(m.label)).join(", "), parts = [];
  if (plan.add.length) parts.push("새 회원 " + plan.add.length + "명을 가져왔습니다");
  const chg = plan.upd.filter(x => x[2]), info = plan.upd.filter(x => !x[2]);
  if (chg.length) parts.push("약이 바뀐 회원 " + chg.length + "명(" + names(chg) + ")의 약을 새로 맞췄습니다");
  if (info.length) parts.push("기록이 바뀐 회원 " + info.length + "명(" + names(info) + ")의 정보를 맞췄습니다");
  if (plan.vit) parts.push("혈압·체중 " + plan.vit + "건을 측정 기록에 넣었습니다");
  let t = where + (parts.length ? "에서 " + parts.join(", ") + "." : "에서 새로 가져오거나 바꿀 회원이 없습니다.");
  if (plan.kept.length) t += " 새 약국이에서도 약을 고친 회원(" + names(plan.kept) + ")은 그대로 두었습니다. 두 쪽의 약을 비교해 맞춰 주세요.";
  return t;
}
const oldPlan = () => syncPlan(oldList());
function refreshImport(){
  const pl = oldPlan(), n = pl.add.length + pl.upd.length;
  $("importOld").hidden = !n;
  $("importOld").textContent = "기존 약국이 회원 가져오기 (" + [pl.add.length ? "새 " + pl.add.length + "명" : "", pl.upd.length ? "바뀜 " + pl.upd.length + "명" : ""].filter(Boolean).join(" · ") + ")";
}
function dataMsg(t, err){ const m = $("dataMsg"); m.textContent = t; m.className = "status" + (err ? " err" : ""); }
function importOld(){
  const pl = oldPlan(); applyPlan(pl);
  dataMsg(planText(pl, "기존 약국이"));
  $("dataMenu").open = true; paint();
}
$("importOld").addEventListener("click", importOld);
$("addMember").addEventListener("click", () => { const m = addMember(); focusDrugs = true; go("#/m/" + m.id); });
$("backupSave").addEventListener("click", () => {
  saveNow();
  const name = "약국이현황판_백업_" + today() + ".json";
  const text = JSON.stringify({app:"약국이 현황판", v:1, saved:new Date().toISOString(), members:db.members, logs:db.logs}, null, 1);
  const a = el("a", {href:URL.createObjectURL(new Blob([text], {type:"application/json"})), download:name});
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 30000);
  dataMsg("회원 " + db.members.length + "명의 기록을 백업 파일로 내려받았습니다.");
});
$("backupLoad").addEventListener("change", e => {
  const f = e.target.files && e.target.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const v = JSON.parse(String(r.result).replace(/^﻿/, ""));
      if (v && v.app === "약국이 현황판" && Array.isArray(v.members)){
        let add = 0, upd = 0, days = 0;
        v.members.filter(m => m && typeof m.id === "string" && typeof m.label === "string").forEach(m => {
          const i = db.members.findIndex(x => x.id === m.id);
          if (i < 0){ db.members.push(m); add++; } else if (str(m.updated) > str(db.members[i].updated)){ db.members[i] = m; upd++; }
        });
        Object.keys(v.logs && typeof v.logs === "object" ? v.logs : {}).forEach(mid => {
          const src = v.logs[mid] || {}, L = db.logs[mid] = db.logs[mid] || {};
          Object.keys(src).forEach(d => { const x = src[d]; if (/^\d{4}-\d{2}-\d{2}$/.test(d) && x && typeof x === "object" && (!L[d] || str(x.at) > str(L[d].at))){ L[d] = x; days++; } });
        });
        anaCache.clear(); saveNow();
        dataMsg("불러왔습니다. 새 회원 " + add + "명, 더 새 기록으로 바뀐 회원 " + upd + "명, 날짜별 기록 " + days + "일.");
      } else if (v && Array.isArray(v.list)){
        const pl = syncPlan(v.list); applyPlan(pl);
        dataMsg(planText(pl, "약국이 백업 파일"));
      } else throw new Error("shape");
      paint();
    } catch (x) { dataMsg("백업 파일을 읽지 못했습니다. 약국이나 약국이 현황판에서 내려받은 .json 파일인지 확인해 주세요.", true); }
    e.target.value = "";
  };
  r.onerror = () => { dataMsg("파일을 읽지 못했습니다.", true); e.target.value = ""; };
  r.readAsText(f);
});
/* 같은 브라우저의 다른 창에서 바뀐 기록을 따라감 (글을 쓰는 중이면 그리지 않음) */
window.addEventListener("storage", e => {
  if (e.key !== KEY && e.key !== OLD) return;
  if (e.key === KEY){ db = loadDb(); anaCache.clear(); }
  const a = document.activeElement;
  if (a && (a.tagName === "TEXTAREA" || (a.tagName === "INPUT" && a.type !== "checkbox"))) return;
  paint();
});
document.addEventListener("click", e => { const m = $("dataMenu"); if (m.open && !m.contains(e.target)) m.open = false; });
route = readHash();
paint();
</script>
